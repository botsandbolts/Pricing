[theme]
base = "light"
primaryColor = "#207b65"
backgroundColor = "#faf8f1"
secondaryBackgroundColor = "#eef2e6"
textColor = "#203e36"
font = "sans serif"

[server]
# Production: avoid unloading modules while another visitor is importing them.
# Restart the deployment after code updates instead of hot-reloading ML modules.
fileWatcherType = "none"
runOnSave = false
