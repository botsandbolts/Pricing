# Copy these keys into Streamlit Community Cloud > App settings > Secrets.
# Never commit actual secrets. The integration stays disabled until configured.
ANALYTICS_ENABLED = false
TURSO_DATABASE_URL = "libsql://YOUR-DATABASE-YOUR-ORG.turso.io"
TURSO_AUTH_TOKEN = "REPLACE_IN_PRIVATE_SETTINGS_ONLY"
ANALYTICS_CONTROLLER_NAME = "REPLACE_WITH_OPERATOR_NAME"
ANALYTICS_CONTROLLER_CONTACT = "REPLACE_WITH_PRIVACY_CONTACT"
# geojs: browser lookup after consent; local: MMDB + trusted proxy header only.
ANALYTICS_GEO_MODE = "geojs"
# Set only after verifying that the hosting proxy OVERWRITES this header.
# Do not trust arbitrary browser-supplied X-Forwarded-For values.
ANALYTICS_TRUSTED_IP_HEADER = ""
ANALYTICS_COUNTRY_HEADER = ""
# Optional local MMDB: either DB-IP City Lite or MaxMind GeoLite2 City.
ANALYTICS_GEO_MMDB = ""
ANALYTICS_GEO_PROVIDER = "DB-IP Lite"
