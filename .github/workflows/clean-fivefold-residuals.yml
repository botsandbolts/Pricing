name: Five-stage CatBoost OOF residual audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/clean_fivefold_residuals.py
      - .github/workflows/clean-fivefold-residuals.yml
permissions:
  contents: read
  actions: read
jobs:
  clean:
    strategy:
      fail-fast: false
      matrix:
        market: [ask, bid]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - uses: actions/download-artifact@v4
        with:
          name: catboost-fivefold-${{ matrix.market }}
          run-id: 41182620241
          github-token: ${{ github.token }}
          path: training-cache/source
      - name: Compute five sequential residual cuts
        run: python -m scripts.clean_fivefold_residuals --predictions training-cache/source/predictions.csv.gz --output training-cache/residual-cleaning/${{ matrix.market }} --market '${{ matrix.market }}' --source-run 41182620241
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-stage-residual-audit-${{ matrix.market }}
          path: training-cache/residual-cleaning/${{ matrix.market }}/
          if-no-files-found: warn
          retention-days: 30
