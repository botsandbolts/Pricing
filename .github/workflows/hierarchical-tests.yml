name: Hierarchical model checks
on:
  push:
    paths: ['pricing/hierarchical*.py', 'pricing/bayesian_hierarchy.py', 'pricing/catboost_residuals.py', 'pricing/forest_residuals.py', 'pricing/forest_live.py', 'pricing/forest_form.py', 'pricing/description_examples.py', 'pricing/forest_time.py', 'pricing/current_value.py', 'tests/test_current_value.py', 'pricing/original_residual_results.py', 'scripts/train_original_residual_comparison.py', 'scripts/train_bayesian_hierarchy.py', 'models/forest-original/**', 'tests/test_hierarchical.py', '.github/workflows/hierarchical-tests.yml']
  pull_request:
    paths: ['pricing/hierarchical*.py', 'pricing/bayesian_hierarchy.py', 'pricing/catboost_residuals.py', 'pricing/forest_residuals.py', 'pricing/forest_live.py', 'pricing/forest_form.py', 'pricing/description_examples.py', 'pricing/forest_time.py', 'pricing/current_value.py', 'tests/test_current_value.py', 'pricing/original_residual_results.py', 'scripts/train_original_residual_comparison.py', 'scripts/train_bayesian_hierarchy.py', 'models/forest-original/**', 'tests/test_hierarchical.py', '.github/workflows/hierarchical-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pricing
            tests
            data/description-examples.json
            marketbridge
            models/time-transport
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pytest requests streamlit catboost scikit-learn xgboost scipy plotly qrcode Pillow
      - run: python -m pytest tests/test_hierarchical.py tests/test_analytics.py tests/test_current_value.py -q
