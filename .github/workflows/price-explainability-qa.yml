name: Car Price Studio · LinkedIn-era Models + Lightweight Explainability QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/price-explainability-qa.yml
      - app.py
      - pricing/neural_experimental_ui.py
      - pricing/price_explain_lite.py
      - pricing/neural_ask_embedding_live.py
      - pricing/neural_bid_blend_live.py
      - pricing/neural_champion_live.py
      - pricing/current_value.py
      - tests/test_price_explain_lite.py
      - tests/test_main_pricing_campaign.py
      - scripts/browser_smoke_main_pricing.py

permissions:
  contents: write

concurrency:
  group: stable-askbid-lite-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  model_and_explanation_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only models and small QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'xgboost>=3,<4' 'streamlit>=1.50,<2' 'plotly>=5.24,<7' 'requests>=2.31,<3' 'pytest>=8,<10' 'joblib>=1.3,<2'
      - name: Compile stable public pricing and XAI
        run: |
          python -m compileall -q app.py pricing/neural_experimental_ui.py pricing/price_explain_lite.py pricing/current_value.py tests/test_price_explain_lite.py
      - name: Run actual caching, numerical, scientific and public-UI contracts
        run: |
          mkdir -p reports/qa/price-lite
          python -m pytest -q \
            tests/test_price_explain_lite.py \
            tests/test_main_pricing_campaign.py \
            tests/test_experimental_two_models.py \
            tests/test_cvar95_experimental_ui.py \
            --junitxml reports/qa/price-lite/unit-junit.xml
      - name: Assert no loading/unloading gimmicks in live paths
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          page=Path('pricing/neural_experimental_ui.py').read_text()
          lite=Path('pricing/price_explain_lite.py').read_text()
          assert 'render_two_market_pricing(Path(__file__).parent,main=True)' in app
          assert 'model.predict_prepared(fields,prepared)' in page
          assert 'results["ask_prepared"]=prepared' in page
          assert 'results["bid_fields"]=bid_fields' in page
          assert 'load_champion_ask(root) if ask_champion' in page
          assert 'load_champion_bid(root) if bid_champion' in page
          assert 'render_price_lite(root,saved,adjusted,' in page
          for text in (app,page,lite):
              assert 'neural_isolated' not in text
              assert 'subprocess.run' not in text
              assert 'import captum' not in text
          assert not Path('pricing/neural_isolated_serving.py').exists()
          assert not Path('pricing/neural_isolated_worker.py').exists()
          assert 'pred_contribs=True' in lite
          assert "if adjusted and not main:" in page
          print('STABLE MODEL CACHE + ONE-CALL LIGHTWEIGHT XAI PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-era-models-lite-xai-tests
          path: reports/qa/price-lite/unit-junit.xml
          if-no-files-found: warn
          retention-days: 30

  public_browser_smoke:
    needs: model_and_explanation_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and lightweight startup dependencies
        run: |
          python -m pip install 'streamlit>=1.50,<2' 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'requests>=2.31,<3' 'plotly>=5.24,<7' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium firefox webkit
      - name: Start real Streamlit app, with native models loaded only on prediction
        run: |
          python -m streamlit run app.py --server.port 8765 --server.address 127.0.0.1 --server.headless true >/tmp/price-lite.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for _ in range(80):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/_stcore/health',timeout=3) as r:
                      if r.status==200:
                          print('Streamlit healthy')
                          break
              except Exception:time.sleep(2)
          else:raise SystemExit('Streamlit failed health check')
          PY
      - name: Desktop, tablet, Android, iPhone and Firefox smoke checks
        run: |
          python -u scripts/browser_smoke_main_pricing.py \
            --base http://127.0.0.1:8765 \
            --output reports/qa/price-lite/browsers
      - name: Record browser logs
        if: always()
        run: |
          mkdir -p reports/qa/price-lite/browsers
          cp /tmp/price-lite.log reports/qa/price-lite/browsers/streamlit.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-era-models-lite-xai-browsers
          path: reports/qa/price-lite/browsers/
          if-no-files-found: warn
          retention-days: 30

  publish_verified_qa:
    if: always()
    needs: [model_and_explanation_contracts,public_browser_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish clear QA state including failed and skipped
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          UNITS: ${{ needs.model_and_explanation_contracts.result }}
          BROWSER: ${{ needs.public_browser_smoke.result }}
        run: |
          mkdir -p reports/qa/price-lite
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,os
          u=os.environ['UNITS'];b=os.environ['BROWSER']
          receipt={
            'source_commit':os.environ['SOURCE_SHA'],
            'workflow_run_id':os.environ['RUN_ID'],
            'tested_utc':datetime.now(timezone.utc).isoformat(),
            'unit_contracts':u,
            'browser_smoke':b,
            'status':'passed' if u=='success' and b=='success' else 'failed',
            'scope':'Synthetic model contracts, native mock TreeSHAP and public browser smoke',
            'limits':'Not a direct measurement of production RAM, host logs or real checkpoint appraisal quality',
          }
          Path('reports/qa/price-lite/latest.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
          cp reports/qa/price-lite/latest.json /tmp/price-lite-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/qa/price-lite
            cp /tmp/price-lite-latest.json reports/qa/price-lite/latest.json
            git add reports/qa/price-lite/latest.json
            if git diff --cached --quiet;then published=1;break;fi
            git commit -m 'Publish stable cached Ask-Bid and lightweight XAI QA receipt'
            if git push origin HEAD:main;then published=1;break;fi
          done
          test "$published" = "1"
