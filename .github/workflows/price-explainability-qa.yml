name: Main pricing · Explainability QA and cross-browser launch gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/price-explainability-qa.yml
      - pricing/neural_price_xai.py
      - pricing/neural_price_xai_ui.py
      - pricing/neural_experimental_ui.py
      - tests/test_neural_price_xai.py
      - tests/test_main_pricing_campaign.py
      - requirements.txt
      - scripts/browser_smoke_main_pricing.py

permissions:
  contents: read

concurrency:
  group: public-explainability-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  model_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test environment, including real Captum
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'xgboost>=3,<4' 'captum>=0.8,<0.9' 'plotly>=5.24,<7' 'streamlit==1.66.1' 'requests>=2.31,<3' 'pytest>=8,<10' 'joblib>=1.3,<2'
      - name: Compile public app, model and explanation modules
        run: |
          python -m compileall -q app.py pricing/neural_price_xai.py pricing/neural_price_xai_ui.py pricing/neural_experimental_ui.py pricing/current_value.py scripts/browser_smoke_main_pricing.py
      - name: Full synthetic dollar parity, real Captum and main-page contracts
        run: |
          mkdir -p reports/qa/price-explainability
          python -m pytest -q \
            tests/test_neural_price_xai.py \
            tests/test_main_pricing_campaign.py \
            tests/test_experimental_two_models.py \
            tests/test_cvar95_experimental_ui.py \
            tests/test_cvar95_champion_release.py \
            --junitxml reports/qa/price-explainability/unit-junit.xml
      - name: No eager transformer/attribution work before a request
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('pricing/neural_price_xai_ui.py').read_text()
          app=Path('app.py').read_text()
          ui=Path('pricing/neural_experimental_ui.py').read_text()
          xai=Path('pricing/neural_price_xai.py').read_text()
          assert 'if main:' in ui and 'render_price_explanations(' in ui
          assert 'if st.button("🔬 Explain the ACTUAL Ask & Bid prices"' in code
          assert 'if st.button("Calculate Captum Integrated Gradients"' in code
          assert 'if st.button("Compute native XGBoost TreeSHAP"' in code
          assert 'if st.button("Run full BGE phrase-removal tests"' in code
          assert 'with st.form("xai_what_if"):' in code
          assert 'from captum.attr import IntegratedGradients' in xai
          assert 'pred_contribs=True' in xai
          assert 'def exact_group_shapley(' in xai
          assert 'from pricing.bart_summary import render_story' not in app
          assert 'Fine-tune the details' not in app
          print('XAI release contract: lazy, traceable, native, no BART, no uncontrolled scans')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-explainability-unit-report
          path: reports/qa/price-explainability/
          retention-days: 30
          if-no-files-found: warn

  five_browser_launch:
    needs: model_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real local browser smoke stack
        run: |
          python -m pip install 'streamlit==1.66.1' 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'requests>=2.31,<3' 'plotly>=5.24,<7' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium firefox webkit
      - name: Start true Streamlit app, not a static mock page
        run: |
          python -m streamlit run app.py --server.port 8765 --server.address 127.0.0.1 --server.headless true > /tmp/car-price-studio-qa.log 2>&1 &
          echo $! > /tmp/car-price-studio-qa.pid
          python - <<'PY'
          import time,urllib.request
          for _ in range(80):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/_stcore/health',timeout=2) as r:
                      if r.status==200:
                          print('Local Streamlit health endpoint ready')
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('Streamlit did not reach healthy state')
          PY
      - name: Chromium desktop/tablet/Android, WebKit iPhone, Firefox desktop
        run: |
          python -u scripts/browser_smoke_main_pricing.py \
            --base http://127.0.0.1:8765 \
            --output reports/qa/price-explainability/browsers
      - name: Retain screenshots, results and app startup logs on pass or fail
        if: always()
        run: |
          mkdir -p reports/qa/price-explainability/browsers
          cp /tmp/car-price-studio-qa.log reports/qa/price-explainability/browsers/streamlit.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-explainability-cross-browser-report
          path: reports/qa/price-explainability/browsers/
          retention-days: 30
          if-no-files-found: warn
