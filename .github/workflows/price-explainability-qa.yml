name: Native Ask-Bid · Low-RAM pricing and explainability QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/price-explainability-qa.yml
      - app.py
      - pricing/neural_experimental_ui.py
      - pricing/neural_price_lite_ui.py
      - pricing/neural_isolated_serving.py
      - pricing/neural_isolated_worker.py
      - pricing/lightweight_price_xai_ui.py
      - tests/test_neural_isolated_recovery.py
      - tests/test_low_memory_recovery.py
      - tests/test_main_pricing_campaign.py
      - scripts/browser_smoke_main_pricing.py
      - requirements.txt

permissions:
  contents: write

concurrency:
  group: public-low-ram-pricing-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  MALLOC_ARENA_MAX: '2'
  PYTHONUNBUFFERED: '1'

jobs:
  low_ram_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test-only CPU dependencies, no Captum/SHAP/transformer download
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'xgboost>=3,<4' 'streamlit==1.66.1' 'requests>=2.31,<3' 'pytest>=8,<10' joblib
      - name: Compile every public neural and low-memory serving module
        run: |
          python -m compileall -q app.py \
            pricing/neural_experimental_ui.py \
            pricing/neural_price_lite_ui.py \
            pricing/neural_isolated_serving.py \
            pricing/neural_isolated_worker.py \
            pricing/lightweight_price_xai_ui.py \
            pricing/current_value.py \
            scripts/browser_smoke_main_pricing.py
      - name: Run public routing, bounded workers, fail-closed OOM, and native architecture tests
        run: |
          mkdir -p reports/qa/neural-low-ram
          python -m pytest -q \
            tests/test_neural_isolated_recovery.py \
            tests/test_low_memory_recovery.py \
            tests/test_main_pricing_campaign.py \
            tests/test_experimental_two_models.py \
            tests/test_cvar95_experimental_ui.py \
            tests/test_cvar95_champion_release.py \
            --junitxml reports/qa/neural-low-ram/unit-junit.xml
      - name: Assert no heavy public XAI or duplicate model residency
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          app=Path('app.py').read_text()
          main=Path('pricing/neural_experimental_ui.py').read_text()
          lite=Path('pricing/neural_price_lite_ui.py').read_text()
          proxy=Path('pricing/neural_isolated_serving.py').read_text()
          assert "if _workspace=='🚗 Price my car':" in app
          assert "render_two_market_pricing(Path(__file__).parent,main=True)" in app
          assert "beta_neural" not in app
          assert 'isolated_price(root,"ask",fields,notes)' in main
          assert 'isolated_price(root,"bid",bid_fields)' in main
          assert 'render_price_lite(root,saved,adjusted)' in main
          assert "if adjusted and not main:" in main
          assert "render_price_explanations(" not in main
          assert "from captum" not in lite and "import torch" not in lite
          assert "import torch" not in proxy
          assert "captum>=" not in Path('requirements.txt').read_text()
          assert 'subprocess.run(' in proxy
          assert 'CPS_NATIVE_RESULT:' in proxy
          assert len([x for x in ast.parse(proxy).body
                      if isinstance(x,(ast.Import,ast.ImportFrom))
                      and 'torch' in ast.unparse(x)])==0
          print('RELEASE CONTRACT VERIFIED: public full models, isolated RAM, tiny XAI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-low-ram-unit-report
          path: reports/qa/neural-low-ram/
          retention-days: 30
          if-no-files-found: warn

  cross_browser_smoke:
    needs: low_ram_contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser-only dependencies; no BGE or PyTorch loaded into public process
        run: |
          python -m pip install 'streamlit==1.66.1' 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'requests>=2.31,<3' 'plotly>=5.24,<7' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run genuine Streamlit server for mobile and desktop UX
        run: |
          python -m streamlit run app.py --server.port 8765 --server.address 127.0.0.1 --server.headless true >/tmp/native-cps.log 2>&1 &
          echo $! > /tmp/native-cps.pid
          python - <<'PY'
          import time,urllib.request
          for _ in range(80):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/_stcore/health',timeout=2) as r:
                      if r.status==200:break
              except Exception:time.sleep(2)
          else:raise SystemExit('Streamlit failed to become healthy')
          print('Streamlit homepage started')
          PY
      - name: Five browser/viewport checks plus historical-date UI
        run: |
          python -u scripts/browser_smoke_main_pricing.py \
            --base http://127.0.0.1:8765 \
            --output reports/qa/neural-low-ram/browsers
      - name: Save screenshots and uncaught exceptions
        if: always()
        run: |
          mkdir -p reports/qa/neural-low-ram/browsers
          cp /tmp/native-cps.log reports/qa/neural-low-ram/browsers/streamlit.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-low-ram-browser-report
          path: reports/qa/neural-low-ram/browsers/
          retention-days: 30
          if-no-files-found: warn

  publish_qa_receipt:
    if: always()
    needs: [low_ram_contracts,cross_browser_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish only verified per-run status, never marketing claims
        env:
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          UNITS: ${{ needs.low_ram_contracts.result }}
          BROWSERS: ${{ needs.cross_browser_smoke.result }}
        run: |
          mkdir -p reports/qa/neural-low-ram
          python - <<'PY'
          import os,json
          from datetime import datetime,timezone
          u=os.environ["UNITS"];b=os.environ["BROWSERS"]
          result={
              "source_commit":os.environ["SOURCE_SHA"],
              "workflow_run_id":os.environ["WORKFLOW_RUN_ID"],
              "tested_utc":datetime.now(timezone.utc).isoformat(),
              "unit_contracts":u,
              "five_browser_smoke":b,
              "status":"passed" if u=="success" and b=="success" else "failed",
              "scope":"Offline unit+browser pre-inference checks; not live host memory or real BGE weight inference",
              "real_checkpoint_performance_checked":False
          }
          with open("reports/qa/neural-low-ram/latest.json","w") as f:
              json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp reports/qa/neural-low-ram/latest.json /tmp/native-cps-qa.json
          published=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/qa/neural-low-ram
            cp /tmp/native-cps-qa.json reports/qa/neural-low-ram/latest.json
            git add reports/qa/neural-low-ram/latest.json
            if git diff --cached --quiet; then published=1;break;fi
            git commit -m 'Record native pricing low-RAM QA result (non-release evidence)'
            if git push origin HEAD:main; then published=1;break;fi
          done
          test "$published" = "1"
