name: Neural regression refinement · preflight only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/neural_50_refine.py
      - tests/test_neural_50_refine.py
      - .github/workflows/neural-50-preflight.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib pytest
      - name: Compile stage-two scripts and verify regression and 200-run gate
        run: |
          python -m compileall -q scripts/neural_50_refine.py scripts/neural_200_sweep.py
          python -m pytest -q tests/test_neural_50_refine.py tests/test_neural_200_sweep.py
      - name: Check refined models are isolated from Streamlit production
        run: |
          python - <<'PY'
          from pathlib import Path
          trainer=Path('scripts/neural_50_refine.py').read_text()
          workflow=Path('.github/workflows/neural-50-regression-refine.yml').read_text()
          assert '200-trial leaderboard' in trainer
          assert 'workflow_run:' in workflow
          assert "types: [completed]" in workflow
          assert "conclusion == 'success'" in workflow
          assert 'max-parallel: 50' in workflow
          assert 'cvar50-trial-' in workflow
          assert 'models/neural-experimental-' not in workflow
          print('Stage two gated by completed 200 run; production checkpoints untouched.')
          PY
