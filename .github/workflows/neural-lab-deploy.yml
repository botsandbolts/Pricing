name: Neural Lab experimental model deployment

# Retired automatic experimental repackaging. Normal UI changes MUST NOT
# retrain or overwrite frozen, release-verified production Ask/Bid checkpoints.
# The historical workflow is still available for an explicit research run.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: neural-lab-serving-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal contract-test stack
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' pytest streamlit joblib
      - name: Compile navigation, progress, science and trained-model source
        run: |
          python -m compileall -q app.py pricing/neural_experimental_live.py pricing/neural_experimental_ui.py pricing/neural_experimental_docs.py scripts/package_neural_experimental.py scripts/rebuild_neural_encoders.py
          python -m pytest tests/test_neural_lab.py -q
          python - <<'PY'
          import ast,pathlib
          ui=pathlib.Path('pricing/neural_experimental_ui.py').read_text()
          assert all(s in ui for s in ['st.progress','MiniLM','soufflé','neural_lab_receipt','record_price','record_server_run'])
          app=pathlib.Path('app.py').read_text()
          assert "if _workspace=='🧬 Experimental models':" in app
          assert "side='bid'" not in ui and "'bid'" not in ui
          print('Navigation, progress milestones, consent analytics, ask-only guardrails passed')
          PY

  package:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CPU model, ONNX and original preprocessing stack
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'pyarrow>=15,<25' 'joblib>=1.3,<2' 'onnxruntime>=1.20,<2' 'tokenizers>=0.23.1,<0.24' streamlit
      - name: Recover frozen original source and train-only feature matrices
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Recover original no-leakage MiniLM price heads and feature scalar
        uses: actions/download-artifact@v4
        with:
          name: ask-minilm-2oob-features
          run-id: 42244440154
          github-token: ${{ github.token }}
          path: training-cache/ask-minilm
      - name: Recover validation-selected DeepCross+AFT+MiniLM checkpoint
        uses: actions/download-artifact@v4
        with:
          name: deepcross-aft-tune-minilm-dropout12
          run-id: 42252201025
          github-token: ${{ github.token }}
          path: training-cache/neural-winner
      - name: Refit original unsupervised encoders and prove heldout ONNX/PyTorch prediction parity
        run: python -u -m scripts.package_neural_experimental
      - name: Check verified manifest and no personal training rows in deployment output
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('models/neural-experimental-ask')
          manifest=json.loads((p/'manifest.json').read_text())
          check=json.loads((p/'verification.json').read_text())
          assert check['verified'] is True and check['original_holdout_samples_checked']>=30
          assert manifest['no_wholesale'] is True
          assert not any(x.name.endswith('.parquet') or x.name.endswith('.csv.gz') for x in p.iterdir())
          print('Verified local-only inference bundle ready:',[(x.name,x.stat().st_size) for x in p.iterdir()])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neural-lab-validated-serving-bundle
          path: models/neural-experimental-ask/
          retention-days: 90
          if-no-files-found: error
      - name: Publish checked model bundle as versioned repository files
        run: |
          cp -a models/neural-experimental-ask "$RUNNER_TEMP/neural-experimental-ask"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p models/neural-experimental-ask
            cp -a "$RUNNER_TEMP/neural-experimental-ask/." models/neural-experimental-ask/
            git add -f models/neural-experimental-ask/
            git diff --cached --quiet && exit 0
            git commit -m 'Install parity-verified DeepCross AFT MiniLM Neural Lab alpha'
            git push origin HEAD:main && exit 0
          done
          exit 1
