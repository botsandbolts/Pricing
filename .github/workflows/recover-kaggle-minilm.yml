name: Recover original Kaggle MiniLM exports
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-kaggle-minilm.yml
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle
      - name: Retrieve saved verified-feature output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p recovered/verified recovered/original
          if [ -z "$KAGGLE_API_TOKEN" ]; then unset KAGGLE_API_TOKEN; fi
          if [ -z "$KAGGLE_KEY" ]; then unset KAGGLE_KEY; fi
          if [ -z "$KAGGLE_USERNAME" ]; then unset KAGGLE_USERNAME; fi
          kaggle kernels output botsandbolts/notebookf1cefc6227 -p recovered/verified
      - name: Retrieve original full MiniLM training output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then unset KAGGLE_API_TOKEN; fi
          if [ -z "$KAGGLE_KEY" ]; then unset KAGGLE_KEY; fi
          if [ -z "$KAGGLE_USERNAME" ]; then unset KAGGLE_USERNAME; fi
          kaggle kernels output botsandbolts/car-price-studio-full-minilm-training -p recovered/original
      - name: Inventory exported predictions and provenance
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          rows=[]
          for p in Path('recovered').rglob('*'):
              if not p.is_file():continue
              rows.append({'file':str(p),'bytes':p.stat().st_size})
              if zipfile.is_zipfile(p):
                  with zipfile.ZipFile(p) as z:
                      rows.extend({'archive':str(p),'file':i.filename,'bytes':i.file_size} for i in z.infolist() if any(s in i.filename.lower() for s in ['oof','provenance','held-predictions','regression.pt']))
          Path('recovered/inventory.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-kaggle-minilm-exports
          path: recovered/
          if-no-files-found: warn
          retention-days: 30
