        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Reuse unchanged matched Lemon XGBoost Bid baseline
        if: ${{ matrix.market == 'bid' }}
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Train native candidate, prune on internal TRAIN CVaR95, validate surviving model once
        run: |
          python -u -m scripts.bohb_cvar95 train \
            --plan proposal/plan.json \
            --history prior/history.json \
            --market "${{ matrix.market }}" \
            --slot "${{ matrix.slot }}" \
            --max-seconds 3000 \
            --output training-results/adaptive
      - name: Preserve original validation predictions and native checkpoint, if not pruned
        uses: actions/upload-artifact@v4
        with:
          name: bohb-result-s4-${{ matrix.market }}-${{ matrix.slot }}
          path: training-results/adaptive/
          retention-days: 30
          compression-level: 4
          if-no-files-found: error

  collect_4:
    needs: [propose_4, train_4]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent metrics and CVaR95 audit dependencies
        run: |
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3'
      - uses: actions/download-artifact@v4
        with:
          name: bohb-plan-4
          path: proposal
      - uses: actions/download-artifact@v4
        with:
          name: bohb-history-3
          path: prior
      - name: Retrieve eight original candidate or pruning receipts
        uses: actions/download-artifact@v4
        with:
          pattern: bohb-result-s4-*
          path: candidate-results
          merge-multiple: false
      - name: Audit all 8 candidates and publish next-stage BOHB training evidence
        run: |
          python -u -m scripts.bohb_cvar95 collect \
            --plan proposal/plan.json \
            --history prior/history.json \
            --artifacts candidate-results \
            --output findings/history.json
      - uses: actions/upload-artifact@v4
        with:
          name: bohb-history-4
          path: findings/history.json
          retention-days: 90
          if-no-files-found: error

  propose_5:
    needs: collect_4
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HpBandSter adaptive coordinator
        run: python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2'
      - name: Recover previous audited Ask/Bid optimization history
        uses: actions/download-artifact@v4
        with:
          name: bohb-history-4
          path: prior
      - name: KDE proposes four unseen Ask and four unseen Bid configurations
        run: |
          python -u -m scripts.bohb_cvar95 propose --stage 5 --history prior/history.json --output proposal/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: bohb-plan-5
          path: proposal/plan.json
          retention-days: 60
          if-no-files-found: error

  train_5:
    needs: propose_5
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        market: [ask, bid]
        slot: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU neural trainers, HpBandSter, and audit tools
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib
      - uses: actions/download-artifact@v4
        with:
          name: bohb-plan-5
          path: proposal
      - name: Recover immutable prior study for BOHB bracket/rung comparisons
        uses: actions/download-artifact@v4
        with:
          name: bohb-history-4
          path: prior
      - name: Reuse original SHA-pinned 2021 Ask training cohort
        if: ${{ matrix.market == 'ask' }}
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Reuse original BGE embeddings, never re-encode per trial
        if: ${{ matrix.market == 'ask' }}
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/bge-256
      - name: Reuse original VIN-disjoint 2015 Bid training cohort
        if: ${{ matrix.market == 'bid' }}
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Reuse unchanged matched Lemon XGBoost Bid baseline
        if: ${{ matrix.market == 'bid' }}
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Train native candidate, prune on internal TRAIN CVaR95, validate surviving model once
        run: |
          python -u -m scripts.bohb_cvar95 train \
            --plan proposal/plan.json \
            --history prior/history.json \
            --market "${{ matrix.market }}" \
            --slot "${{ matrix.slot }}" \
            --max-seconds 3000 \
            --output training-results/adaptive
      - name: Preserve original validation predictions and native checkpoint, if not pruned
        uses: actions/upload-artifact@v4
        with:
          name: bohb-result-s5-${{ matrix.market }}-${{ matrix.slot }}
          path: training-results/adaptive/
          retention-days: 30
          compression-level: 4
          if-no-files-found: error

  collect_5:
    needs: [propose_5, train_5]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent metrics and CVaR95 audit dependencies
        run: |
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3'
      - uses: actions/download-artifact@v4
        with:
          name: bohb-plan-5
          path: proposal
      - uses: actions/download-artifact@v4
        with:
          name: bohb-history-4
          path: prior
      - name: Retrieve eight original candidate or pruning receipts
        uses: actions/download-artifact@v4
        with:
          pattern: bohb-result-s5-*
          path: candidate-results
          merge-multiple: false
      - name: Audit all 8 candidates and publish next-stage BOHB training evidence
        run: |
          python -u -m scripts.bohb_cvar95 collect \
            --plan proposal/plan.json \
            --history prior/history.json \
            --artifacts candidate-results \
            --output findings/history.json
      - uses: actions/upload-artifact@v4
        with:
          name: bohb-history-5
          path: findings/history.json
          retention-days: 90
          if-no-files-found: error

  final_report:
    needs: collect_5
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bohb-history-5
          path: findings
      - name: Summarize CVaR95-first Ask/Bid results without promoting any model
        run: |
          python - <<'PY'
          import json
          p=json.load(open('findings/history.json'))
          assert len(p['records'])==48
          for market in ('ask','bid'):
              rows=p['full_budget_leaderboard'][market]
              compare=p['compared_to_deployed_verified'][market]
              counts=p['budget_distribution'][market]
              print(f'{market.upper()}: all budgets {counts}; FULL 36-epoch={len(rows)}')
              for metric,v in compare['metrics'].items():
                  print(f"  {metric}: incumbent={v['incumbent']:,.2f}, challenger={v['challenger']}, saved={v['saved_usd']}")
              print('  CVaR95 improved over existing:',compare['challenger_beats_incumbent_on_CVaR95'])
              for row in rows:
                  print(f"  full-trial={row['trial']} CVaR95=${row['CVaR95_absolute_USD']:,.0f} RMSE=${row['RMSE_USD']:,.0f} MAE=${row['MAE_USD']:,.0f}")
          assert p['not_for_deployment'] and not p['test_evaluated']
          PY
      - name: No tested candidate is automatically promoted
        run: echo "Original deployed Ask, Bid, frozen BGE, Lemon XGBoost and Captum remain untouched."

      - name: Preserve audited CVaR95/MAE/RMSE head-to-head benchmark
        uses: actions/upload-artifact@v4
        with:
          name: bohb-final-vs-deployed
          path: findings/history.json
          retention-days: 90
          if-no-files-found: error
