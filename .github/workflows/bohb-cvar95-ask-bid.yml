      - name: Install HpBandSter adaptive coordinator
        run: python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2'
      - name: Recover previous audited Ask/Bid optimization history
        uses: actions/download-artifact@v4
        with:
          name: bohb-history-0
          path: prior
      - name: KDE proposes four unseen Ask and four unseen Bid configurations
        run: |
          python -u -m scripts.bohb_cvar95 propose --stage 1 --history prior/history.json --output proposal/plan.json
      - uses: actions/upload-artifact@v4
