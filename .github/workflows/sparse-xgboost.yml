name: Sparse Lemon Squeezer XGBoost deployment
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/train_sparse_xgboost.py
      - .github/workflows/sparse-xgboost.yml
concurrency:
  group: sparse-lemon-release
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' 'xgboost>=3.0,<4' 'lightgbm>=4.5,<5' 'requests>=2.31,<3' 'joblib>=1.3,<2' 'streamlit==1.66.1'
      - name: Restore original cohorts
        run: |
          mkdir -p training-cache
          curl --fail --location --retry 3 --output training-cache/ask.zip 'https://zenodo.org/records/10457828/files/Used%20Cars%20Dataset.zip?download=1'
          echo 'eb2ad6c7dedd3c73ffed4bf47929ab66e55d7da186ed240230caa1fad85d2e8f  training-cache/ask.zip' | sha256sum -c -
          curl --fail --location --retry 3 --output training-cache/bid.zip 'https://www.kaggle.com/api/v1/datasets/download/tunguz/used-car-auction-prices'
          echo 'acfe086790275ce843700303f0701446f5326852be1ee11d9d2e9407d0301e8d  training-cache/bid.zip' | sha256sum -c -
          python -m scripts.prepare_full training-cache/ask.zip --output training-cache/full-cohort.jsonl --workers 4
          python -m carbids.data --input training-cache/bid.zip --output training-cache/bid-cohort.jsonl
      - name: Fresh five-fold TF-IDF XGBoost residuals on original training cars
        run: |
          python -m scripts.train_sparse_xgboost --market ask --iterations 300 --output training-cache/tfidf-oof
          python -m scripts.train_sparse_xgboost --market bid --iterations 300 --output training-cache/tfidf-oof
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-tfidf-oof-residuals
          path: training-cache/tfidf-oof/
          retention-days: 30
      - name: Export and precompute frozen MiniLM signal offline
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          pip install 'transformers==4.57.1' 'onnx>=1.16,<2' 'onnxruntime>=1.20,<2' 'tokenizers>=0.22,<0.23'
          python -m scripts.prepare_minilm_signal --cohort training-cache/full-cohort.jsonl --output training-cache/minilm-signal
      - name: Cut 25 percent using fresh TF-IDF residuals and retrain XGBoost
        run: |
          python -m scripts.train_sparse_xgboost --market ask --iterations 300 --output training-cache/xgboost-sparse --residual-source training-cache/tfidf-oof/ask/predictions.csv.gz --minilm-features training-cache/minilm-signal
          python -m scripts.train_sparse_xgboost --market bid --iterations 300 --output training-cache/xgboost-sparse --residual-source training-cache/tfidf-oof/bid/predictions.csv.gz
      - name: Fit matching Bayesian posteriors
        run: |
          python -m scripts.fit_fivefold_bayes --base-kind xgboost --market ask --cohort training-cache/full-cohort.jsonl --predictions training-cache/xgboost-sparse/ask/predictions.csv.gz --output training-cache/xgboost-sparse/ask/bayesian
          python -m scripts.fit_fivefold_bayes --base-kind xgboost --market bid --cohort training-cache/bid-cohort.jsonl --predictions training-cache/xgboost-sparse/bid/predictions.csv.gz --output training-cache/xgboost-sparse/bid/bayesian
      - name: Package and verify real inference
        run: |
          python -m compileall -q pricing/sparse_live.py scripts/train_sparse_xgboost.py
          python -m scripts.deploy_sparse_xgboost
      - uses: actions/upload-artifact@v4
        with:
          name: sparse-lemon-serving
          path: models/xgboost-sparse-minilm/
          retention-days: 90
      - name: Install verified weights for Streamlit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mv models/xgboost-sparse-minilm "$RUNNER_TEMP/xgboost-sparse-minilm"
          git pull --ff-only origin main
          python -c "import shutil; shutil.rmtree('models/xgboost-sparse-minilm',ignore_errors=True)"
          mv "$RUNNER_TEMP/xgboost-sparse-minilm" models/xgboost-sparse-minilm
          git add -A models/xgboost-sparse-minilm/
          git commit -m 'Deploy compact sparse-TFIDF Lemon Squeezer XGBoost and matching Bayesian hierarchy'
          git push origin HEAD:main
