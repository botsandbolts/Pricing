name: Firefox · landing branding, privacy and one-click calculator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/landing-banner-qa.yml
      - app.py
      - pricing/studio_design.py
      - pricing/neural_experimental_ui.py
      - pricing/garage_art.py
      - pricing/navigation.py
      - assets/garage.css
      - tests/test_landing_banner.py
      - tests/landing_hero_fixture.py
      - scripts/browser_landing_banner_smoke.py

permissions:
  contents: read

concurrency:
  group: landing-banner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Streamlit UI runtime, pytest and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'streamlit>=1.51,<2' 'pytest>=8,<10' 'playwright>=1.55,<2'
      - name: Compile all revised public UI entrypoints
        run: |
          python -m compileall -q app.py pricing/studio_design.py pricing/navigation.py pricing/neural_experimental_ui.py tests/test_landing_banner.py tests/landing_hero_fixture.py scripts/browser_landing_banner_smoke.py
      - name: Run public trust claims, navigation CTA and privacy-source regression tests
        run: |
          python -m pytest -q tests/test_landing_banner.py
      - name: Install real headless Firefox and Linux runtime libraries
        run: |
          python -m playwright install --with-deps firefox
      - name: Verify 1440/820/390/320px layout, real anchor navigation and privacy disclosure
        run: |
          python -m scripts.browser_landing_banner_smoke
      - name: Preserve before-release mobile/desktop screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-landing-hero-visual-qa
          path: reports/qa/landing-banner/
          if-no-files-found: warn
          retention-days: 30
