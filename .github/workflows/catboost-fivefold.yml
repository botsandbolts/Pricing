name: Original-cohort five-fold CatBoost CPU
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: CatBoost trees per model
        type: number
        default: 1000
  push:
    paths:
      - scripts/train_catboost_fivefold.py
      - scripts/fit_fivefold_bayes.py
      - .github/workflows/catboost-fivefold.yml
permissions:
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        market: [ask, bid]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' 'catboost==1.2.10' 'lightgbm>=4.5,<5' 'requests>=2.31,<3' 'umap-learn>=0.5.7,<0.6' 'joblib>=1.3,<2'
      - name: Restore exact original archives
        run: |
          mkdir -p training-cache
          curl --fail --location --retry 3 --output training-cache/ask.zip 'https://zenodo.org/records/10457828/files/Used%20Cars%20Dataset.zip?download=1'
          echo 'eb2ad6c7dedd3c73ffed4bf47929ab66e55d7da186ed240230caa1fad85d2e8f  training-cache/ask.zip' | sha256sum -c -
          if [ '${{ matrix.market }}' = 'bid' ]; then
            curl --fail --location --retry 3 --output training-cache/bid.zip 'https://www.kaggle.com/api/v1/datasets/download/tunguz/used-car-auction-prices'
            echo 'acfe086790275ce843700303f0701446f5326852be1ee11d9d2e9407d0301e8d  training-cache/bid.zip' | sha256sum -c -
          fi
      - name: Prepare canonical Craigslist cohort
        run: python -m scripts.prepare_full training-cache/ask.zip --output training-cache/full-cohort.jsonl --workers 4
      - name: Prepare canonical auction cohort
        if: matrix.market == 'bid'
        run: python -m carbids.data --input training-cache/bid.zip --output training-cache/bid-cohort.jsonl
      - name: Train five group-held-out CatBoost models
        run: python -m scripts.train_catboost_fivefold --market '${{ matrix.market }}' --iterations '${{ inputs.iterations || 1000 }}'
      - name: Fit joint Bayesian OOF log-residual correction
        run: |
          if [ '${{ matrix.market }}' = ask ]; then cohort=training-cache/full-cohort.jsonl; else cohort=training-cache/bid-cohort.jsonl; fi
          python -m scripts.fit_fivefold_bayes --market '${{ matrix.market }}' --cohort "$cohort" --predictions "training-cache/catboost-fivefold/${{ matrix.market }}/predictions.csv.gz" --output "training-cache/catboost-fivefold/${{ matrix.market }}/bayesian"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catboost-fivefold-${{ matrix.market }}
          path: training-cache/catboost-fivefold/${{ matrix.market }}/
          if-no-files-found: warn
          retention-days: 30
