name: Structural transfer checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-cleanlab.txt pytest
      - run: python -m compileall -q marketbridge pricing carbids app.py
      - run: OMP_NUM_THREADS=4 pytest -q tests/test_marketbridge.py tests/test_robust.py tests/test_visual_explanations.py tests/test_cleanlab.py tests/test_pipeline.py tests/test_model_suite.py

      - run: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 pytest -q tests/test_current_explanations.py tests/test_release_navigation.py tests/test_two_minilm_prices.py tests/test_editor_persistence.py tests/test_nov11_streamlit_log_regressions.py
      - run: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 pytest -q tests/test_i18n_locales.py tests/test_i18n_journey.py tests/test_i18n_international.py tests/test_i18n_international_app.py
