name: Structural transfer checks
on: [push, pull_request]
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q marketbridge pricing carbids app.py
      - run: OMP_NUM_THREADS=4 pytest -q tests/test_marketbridge.py tests/test_robust.py
