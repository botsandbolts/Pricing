name: Release 08 Nov Lemon75 DeepCross Ask · INT8 ONNX full validation parity
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-ray-lemon75-ask.yml
      - scripts/release_ray_lemon75_ask.py
      - pricing/ray_lemon75_ask_live.py
      - pricing/ray_lemon75_ask_ui.py
      - pricing/neural_experimental_ui.py
      - pricing/captum_price_lite.py
      - tests/test_ray_lemon75_release.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-ray-lemon75-ask-int8
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  audit_quantize_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch, independent ONNX runtime and validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'pyarrow>=15,<25' 'onnx>=1.16,<2' 'onnxscript>=0.3,<1' 'onnxruntime>=1.20,<2' 'streamlit>=1.40,<2' pytest
      - name: Compile exact deployment and check candidate is gated until verified
        run: |
          python -m compileall -q pricing/ray_lemon75_ask_live.py pricing/ray_lemon75_ask_ui.py pricing/neural_experimental_ui.py pricing/captum_price_lite.py scripts/release_ray_lemon75_ask.py tests/test_ray_lemon75_release.py
          python -m pytest -q tests/test_ray_lemon75_release.py
      - name: Recover exact completed one-hour Ray Lemon75 DeepCross checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ray-ask-lemon75-deepcross
          run-id: 42485146978
          github-token: ${{ github.token }}
          path: training-cache/ray-lemon75-source
      - name: Recover immutable original Ask features including train-only Lemon mask
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Recover SHA-verified frozen original BGE embedding vectors
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/bge-256
      - name: Recover unchanged PRE-Lemon reference for exact 75% validation filter
        uses: actions/download-artifact@v4
        with:
          name: matched-bayesian-redesign-data
          run-id: 41230037897
          github-token: ${{ github.token }}
          path: training-cache/original-lemon-reference
      - name: Full native checkpoint replay, frozen Lemon membership, FP32 and INT8 parity
        run: |
          test -s training-cache/ray-lemon75-source/weights.pt
          test -s training-cache/ray-lemon75-source/result.json
          test -s training-cache/ray-lemon75-source/validation.csv.gz
          test -s training-cache/original-lemon-reference/ask-minilm-oof.csv.gz
          python -u -m scripts.release_ray_lemon75_ask \
            --source training-cache/ray-lemon75-source \
            --features training-cache/neural-ask/features.npz \
            --embeddings training-cache/bge-256 \
            --reference training-cache/original-lemon-reference/ask-minilm-oof.csv.gz \
            --output models/neural-ray-lemon75-ask
      - name: Verify the exact gated production manifest and quantized files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pricing.ray_lemon75_ask_live import manifest
          d=manifest('.')
          assert d is not None,'INT8 ONNX release did not pass its serving contract'
          assert d['market']=='ask'
          assert d['original_test_scored'] is False
          assert d['filtered_validation_rows']==23751
          assert d['filtered_validation_is_conditional'] is True
          assert d['quantization']=='onnxruntime-dynamic-int8-matmul-gemm'
          assert all(Path('models/neural-ray-lemon75-ask',name).is_file()
                     for name in ('weights.pt','head-int8.onnx','manifest.json','verification.json'))
          print('LEMON75_PRODUCTION_CONTRACT', d['filtered_validation'],flush=True)
          PY
      - name: Preserve verified release artifacts for rollback
        uses: actions/upload-artifact@v4
        with:
          name: ray-lemon75-deepcross-int8-verified-production
          path: models/neural-ray-lemon75-ask/
          retention-days: 90
          if-no-files-found: error
      - name: Promote only verified original model and INT8 weights to main
        run: |
          cp -a models/neural-ray-lemon75-ask "$RUNNER_TEMP/verified-ray-lemon75-ask"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            for path in pricing/ray_lemon75_ask_live.py pricing/ray_lemon75_ask_ui.py scripts/release_ray_lemon75_ask.py; do
              test "$(git hash-object "$path")" = "$(git rev-parse "origin/main:$path")" || {
                echo "Deployment code changed during audit: $path"
                exit 1
              }
            done
            git reset --hard origin/main
            mkdir -p models/neural-ray-lemon75-ask
            cp -a "$RUNNER_TEMP/verified-ray-lemon75-ask/." models/neural-ray-lemon75-ask/
            git add -f models/neural-ray-lemon75-ask/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish original Lemon75 DeepCross with independently parity-audited INT8 ONNX'
            if git push origin HEAD:main; then
              echo 'Verified November Lemon75 Ask is now published to main.'
              exit 0
            fi
          done
          exit 1
