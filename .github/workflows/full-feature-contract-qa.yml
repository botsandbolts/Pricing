name: Full product contracts · pricing, navigation, trust and research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-feature-contract-qa.yml
      - app.py
      - pricing/**
      - marketbridge/**
      - tests/test_*.py

permissions:
  contents: read

concurrency:
  group: full-product-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [pricing-engines, workspaces-and-research, privacy-and-accessibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the production application and test runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Provide native OCR binary for the real screenshot-to-listing feature
        if: matrix.suite == 'workspaces-and-research'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Compile all application modules, first-party tests and key entrypoints
        run: |
          python -m compileall -q app.py pricing marketbridge tests
      - name: Run true behavior and model-contract tests (not snapshot-only checks)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qa/full-contracts
          if [[ "${{ matrix.suite }}" == "pricing-engines" ]]; then
            tests=(
              tests/test_europe_market.py
              tests/test_current_value.py
              tests/test_current_explanations.py
              tests/test_reference_prices.py
              tests/test_aft_serving.py
              tests/test_bid_quantile.py
              tests/test_captum_price_lite.py
              tests/test_neural_lab.py
            )
          elif [[ "${{ matrix.suite }}" == "workspaces-and-research" ]]; then
            tests=(
              tests/test_main_pricing_campaign.py
              tests/test_release_navigation.py
              tests/test_landing_banner.py
              tests/test_description_examples.py
              tests/test_deal_tools.py
              tests/test_deal_ui.py
              tests/test_dealer_signals.py
              tests/test_marketbridge.py
              tests/test_merchant_reco.py
            )
          else
            tests=(
              tests/test_analytics.py
              tests/test_legal_pages.py
              tests/test_accessibility.py
              tests/test_ga_events.py
              tests/test_feature_telemetry.py
              tests/test_sale_feedback.py
            )
          fi
          python -m pytest -q --junitxml="reports/qa/full-contracts/${{ matrix.suite }}.xml" "${tests[@]}"
      - name: Save exact regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-product-contracts-${{ matrix.suite }}
          path: reports/qa/full-contracts/
          if-no-files-found: warn
          retention-days: 30
