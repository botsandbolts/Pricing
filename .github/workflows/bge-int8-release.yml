name: BGE-small INT8 parity, real price drift and RAM optimization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bge-int8-release.yml
      - scripts/release_bge_int8.py
      - scripts/memory_watch_selftest.py
      - pricing/quantized_bge_runtime.py
      - pricing/neural_ask_embedding_live.py
      - pricing/memory_watch.py
      - requirements.txt

permissions:
  contents: write

concurrency:
  group: bge-int8-native-parity-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  quantize_validate_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the actual production runtime and offline ONNX converter
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir 'onnx>=1.19,<2'
      - name: Compile serving/quantization scripts and check privacy-safe profiler
        run: |
          python -m compileall -q pricing/quantized_bge_runtime.py pricing/neural_ask_embedding_live.py pricing/memory_watch.py scripts/release_bge_int8.py
          python -m scripts.memory_watch_selftest
      - name: Quantize pinned BGE encoder; measure REAL vehicle price drift and process RSS
        run: |
          mkdir -p reports/qa/bge-int8-release
          python -m scripts.release_bge_int8 all
      - name: Check both real native prices and unchanged Captum-enabled heads
        env:
          PRICING_BGE_BACKEND: int8
        run: |
          python -m scripts.native_pricing_runtime_smoke
      - name: Install Memray only on CI; trace native extension allocations
        continue-on-error: true
        run: |
          python -m pip install --no-cache-dir memray
          python -m memray run --native --aggregate \
            -o reports/qa/bge-int8-release/memray-int8.bin \
            -m scripts.native_pricing_runtime_smoke
          python -m memray stats \
            reports/qa/bge-int8-release/memray-int8.bin \
            > reports/qa/bge-int8-release/memray-int8-summary.txt
          # Native stack traces may contain code paths; collect only on
          # private workflow artifacts, not in public Streamlit memory logs.
      - name: Promote INT8 model ONLY after parity and RSS release gates passed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'Main changed during expensive quantization; refusing stale promotion.'
            exit 1
          }
          test -s models/bge-small-int8-onnx/model_int8.onnx
          test -s models/bge-small-int8-onnx/tokenizer.json
          test -s models/bge-small-int8-onnx/manifest.json
          git add models/bge-small-int8-onnx/ \
                  reports/qa/bge-int8-release/weight-savings.json \
                  reports/qa/bge-int8-release/price-parity.json \
                  reports/qa/bge-int8-release/memory-parity.json
          git commit -m 'Release measured BGE-small INT8 encoder after real-dollar parity and memory gate'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bge-int8-onnx-parity-memory-and-memray
          path: reports/qa/bge-int8-release/
          retention-days: 30
          if-no-files-found: warn
