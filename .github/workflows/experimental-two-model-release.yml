name: Experimental two-model release · BGE DeepCross ask + DeepFM wholesale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pricing/neural_ask_embedding_live.py
      - pricing/neural_bid_blend_live.py
      - pricing/neural_experimental_ui.py
      - scripts/package_ask_bge_experimental.py
      - scripts/package_bid_deepfm_experimental.py
      - tests/test_experimental_two_models.py
      - tests/test_cvar95_experimental_ui.py
      - pricing/cvar95_experiment_science.py
      - .github/workflows/experimental-two-model-release.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: experimental-ask-bid-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU only neural/Streamlit contract dependencies
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' 'xgboost>=3,<4' streamlit joblib pytest
      - name: Compile and test only experimental two-model modules and provenance
        run: |
          python -m compileall -q pricing/cvar95_experiment_science.py
          python -m compileall -q \
            pricing/neural_ask_embedding_live.py \
            pricing/neural_bid_blend_live.py \
            pricing/neural_experimental_ui.py \
            scripts/package_ask_bge_experimental.py \
            scripts/package_bid_deepfm_experimental.py
          python -m pytest -q tests/test_experimental_two_models.py tests/test_neural_lab.py tests/test_cvar95_experimental_ui.py
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          assert "if _workspace=='🧬 Experimental models':" in app
          original=Path('pricing/neural_experimental_ui.py').read_text()
          assert 'bge_whatif_run' in original and 'deepfm_bid' in original
          assert "from pricing.neural_ask_embedding_live import load" in original
          assert "from pricing.neural_bid_blend_live import load" in original
          assert "MiniLM Ridge" in original
          assert "head_price(" not in Path('pricing/neural_ask_embedding_live.py').read_text()
          print('Both research engines confined to Experimental models. Main calculator unchanged.')
          PY

  ask:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact BGE encoder export and local runtime stack
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'pyarrow>=15,<25' joblib streamlit
          python -m pip install 'sentence-transformers==3.4.1' 'transformers==4.49.0' 'huggingface-hub==0.30.2' 'onnx>=1.16,<2' 'onnxruntime>=1.20,<2' 'tokenizers>=0.21,<0.22' 'onnxscript>=0.4,<1'
      - name: Recover original 2021 asking feature tensors and canonical descriptions
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Recover all original frozen BGE-small 256-token sentence vectors
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/bge-256
      - name: Recover exact validation-selected BGE + complete DeepCross/AFT weights
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-trained-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/ask-bge-winner
      - name: Recover original winner-only untouched test predictions for serving parity
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-only-comparison
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/ask-bge-report
      - name: Export pinned BGE to INT8 ONNX; verify original embeddings and entire network predictions
        run: |
          python -u -m scripts.package_ask_bge_experimental
      - name: Assert no Ridge or original user/source rows in release
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path('models/neural-experimental-ask-bge')
          meta=json.loads((folder/'manifest.json').read_text())
          verify=json.loads((folder/'verification.json').read_text())
          assert verify['verified'] is True and verify['original_holdout_samples_checked']>=40
          assert verify['full_network_parity_passed'] is True and meta['text_price_heads']==0
          assert not any(path.suffix in {'.parquet','.npz','.npy','.csv'} for path in folder.iterdir())
          assert not any(path.name.startswith('encoder-fp32') for path in folder.iterdir())
          print('BGE full DeepCross original listing parity verified; no Ridge')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-deepcross-bge-only-ask-release
          path: models/neural-experimental-ask-bge/
          retention-days: 90
          if-no-files-found: error
      - name: Publish ONLY parity-verified experimental asking bundle
        run: |
          cp -a models/neural-experimental-ask-bge "$RUNNER_TEMP/ask-bge"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p models/neural-experimental-ask-bge
            cp -a "$RUNNER_TEMP/ask-bge/." models/neural-experimental-ask-bge/
            git add -f models/neural-experimental-ask-bge/
            git diff --cached --quiet && exit 0
            git commit -m 'Install parity-verified BGE embeddings-only full DeepCross AFT in Experimental models'
            git push origin HEAD:main && exit 0
          done
          exit 1

  bid:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical DeepFM + native XGBoost serving dependencies
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'xgboost>=3,<4' 'pyarrow>=15,<25' joblib streamlit
      - name: Recover complete original full and Lemon VIN-disjoint auction tensors
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Recover RMSE-selected full-data DeepFM32 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: bid-fm-scale-deepfm32_full
          run-id: 42279280866
          github-token: ${{ github.token }}
          path: training-cache/bid-winner
      - name: Recover independently audited winner original-test dollar predictions
        uses: actions/download-artifact@v4
        with:
          name: bid-fm-scale-full-vs-lemon-verified
          run-id: 42279280866
          github-token: ${{ github.token }}
          path: training-cache/bid-report
      - name: Recover exact archived per-row XGBoost Lemon 2015 wholesale benchmark
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Prove all original preprocessing and both constituent models reproduce withheld prices
        run: python -u -m scripts.package_bid_deepfm_experimental
      - name: Verify bid original test parity and isolation from live production
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path('models/neural-experimental-bid')
          v=json.loads((folder/'verification.json').read_text())
          assert v['verified'] is True and v['original_holdout_rows_checked']>=40
          assert v['deepfm_archived_predictions_match'] and v['xgboost_archived_predictions_match']
          assert not any(path.suffix in {'.parquet','.npz','.npy'} for path in folder.iterdir())
          print('DeepFM and matched Lemon XGBoost original holdout parity verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deepfm32-full-lemon-xgboost-75-25-bid-release
          path: models/neural-experimental-bid/
          retention-days: 90
          if-no-files-found: error
      - name: Publish ONLY checked experimental wholesale bundle
        run: |
          cp -a models/neural-experimental-bid "$RUNNER_TEMP/bid-deepfm"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p models/neural-experimental-bid
            cp -a "$RUNNER_TEMP/bid-deepfm/." models/neural-experimental-bid/
            git add -f models/neural-experimental-bid/
            git diff --cached --quiet && exit 0
            git commit -m 'Install parity-verified historical DeepFM plus XGBoost wholesale Experimental model'
            git push origin HEAD:main && exit 0
          done
          exit 1
