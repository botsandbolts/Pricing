name: Independently promote BOHB Bid116 after untouched-test gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-overnight-bid.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: deploy-bohb-bid-test-gated
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'

jobs:
  verify_and_publish_bid:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch, original XGBoost inference and audit dependencies
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'xgboost>=3,<4' joblib streamlit
      - name: Recover original audited 240-evaluation final research receipt
        uses: actions/download-artifact@v4
        with:
          name: overnight-BOHB-final-comparison
          run-id: 42406868569
          github-token: ${{ github.token }}
          path: selected/final
      - name: Recover exact BOHB Bid #116 original checkpoint, not regenerated weights
        uses: actions/download-artifact@v4
        with:
          name: overnight-result-s29-bid-0
          run-id: 42406868569
          github-token: ${{ github.token }}
          path: selected/bid
      - name: Recover original full VIN-disjoint auction feature cohort
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Recover original paired Lemon XGBoost validation and TEST predictions
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Reproduce all 82380 original validation predictions and evaluate untouched 83603 test rows
        run: |
          python -u -m scripts.release_overnight_bohb \
            --market bid \
            --report selected/final/nightmare-final-comparison.json \
            --winner selected/bid \
            --features training-cache/neural-bid/features.npz \
            --baseline benchmark-reference/bid/predictions.csv.gz \
            --output models/neural-bohb-bid
      - name: Fail closed unless checkpoint serves original features with exact parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pricing.overnight_bohb_live import available
          assert available('.', 'bid'), 'BOHB Bid not independently test-verified'
          m=json.loads(Path('models/neural-bohb-bid/manifest.json').read_text())
          assert m['trial']==116 and m['bge_in_bid_model'] is False
          assert m['historical_test']['CVaR95_absolute_USD'] < m['historical_incumbent_test']['CVaR95_absolute_USD']
          print('BID_BOHB_PRODUCTION_GATE_PASSED',m['historical_test'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bohb-bid116-original-test-parity-and-native-weights
          path: models/neural-bohb-bid/
          retention-days: 90
          if-no-files-found: error
      - name: Publish Bid only, preserving proven Ask model and original rollback bundle
        run: |
          cp -a models/neural-bohb-bid "$RUNNER_TEMP/bohb-bid"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p models/neural-bohb-bid
            cp -a "$RUNNER_TEMP/bohb-bid/." models/neural-bohb-bid/
            git add -f models/neural-bohb-bid/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Deploy original-test-verified BOHB CVaR95 Bid #116'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
