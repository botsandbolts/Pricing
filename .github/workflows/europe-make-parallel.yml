name: European deduplication — 50 parallel make-year shards

on:
  push:
    branches:
      - feature/europe-dedupe-granite-20261109
    paths:
      - 'pricing/europe_make_shards.py'
      - 'pricing/europe_dedupe.py'
      - 'pricing/europe_prune.py'
      - 'tests/test_europe_make_shards.py'
      - '.github/workflows/europe-make-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

# Same repository-level group as the old 12-shard workflow. A new push
# cancels the old 12-way run before scheduling the replacement.
concurrency:
  group: europe-make-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel_previous:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Explicitly request cancellation of superseded 12-shard run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/runs/42649951405/cancel" \
            && echo "Previous 12-way run cancellation requested" \
            || echo "Previous run already stopped or cancellation refused; concurrency cancellation also applies"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sharding and audit test dependencies
        run: python -m pip install -r requirements-europe-dedupe.txt
      - name: Validate same-make-and-year restrictions and global mapping
        run: python -m pytest -q tests/test_europe_dedupe.py tests/test_europe_make_shards.py

  prepare:
    needs: [cancel_previous, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data tools
        run: python -m pip install -r requirements-europe-dedupe.txt huggingface_hub
      - name: Download the original European Parquet dataset once
        id: dataset
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          path=hf_hub_download(
              repo_id='KTHESAT/european-used-car-market-2m-listings',
              repo_type='dataset',
              filename='data/train-00000-of-00001.parquet')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('path='+path+'\n')
          PY
      - name: Partition by normalized make and production/model year
        run: |
          python -m pricing.europe_make_shards partition \
            --input "${{ steps.dataset.outputs.path }}" \
            --output "$RUNNER_TEMP/make-parts" \
            --shards 50
      - name: Publish 50-way balancing and year-provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: eu-make-manifest
          path: ${{ runner.temp }}/make-parts/manifest.json
          retention-days: 7
      - name: Upload segment shard 00
        uses: actions/upload-artifact@v4
        with:
          name: eu-make-shard-00
          path: ${{ runner.temp }}/make-parts/shard-00.parquet
          retention-days: 1
      - name: Upload segment shard 01
