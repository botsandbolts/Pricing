name: Overnight ResMLP European release · Firefox desktop and mobile
on:
  push:
    branches: [release/europe-resmlp-overnight-20261111]
    paths:
      - 'models/europe-resmlp-overnight/**'
      - 'tests/firefox_europe_e2e.py'
      - 'pricing/europe_market.py'
      - '.github/workflows/europe-resmlp-overnight-firefox.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eu-resmlp-release-firefox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require complete frozen ResMLP model package before browser checks
        run: |
          test -f models/europe-resmlp-overnight/champion.pt
          test -f models/europe-resmlp-overnight/schema.json
          test -f models/europe-resmlp-overnight/release_manifest.json
          test -f models/europe-resmlp-overnight/comparison.json
      - name: Install verified production-compatible CPU dependencies and Firefox
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' \
            'pyarrow>=17,<23' 'pytest>=8,<10' 'streamlit==1.66.1' \
            'plotly>=5.24,<7' 'scikit-learn>=1.4,<2' \
            'playwright>=1.55,<2'
          python -m playwright install --with-deps firefox
      - name: Verify the production ResMLP, country list and receipt policy
        run: python -m pytest -q tests/test_europe_market.py
      - name: Live Streamlit plus Firefox desktop/mobile EU ASK, 12 panel/return and US gateway checks
        run: |
          (python -m streamlit run app.py --server.headless true \
            --server.address 127.0.0.1 --server.port 8507 \
            --browser.gatherUsageStats false > /tmp/eu-resmlp-firefox.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8507/_stcore/health; then break; fi
            sleep 2
          done
          status=0
          python -u tests/firefox_europe_e2e.py || status=1
          if test "$status" -ne 0; then tail -n 250 /tmp/eu-resmlp-firefox.log; fi
          exit "$status"
      - name: Preserve real browser screenshots and model release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-resmlp-overnight-firefox-acceptance
          path: artifacts/firefox-europe/
          if-no-files-found: warn
          retention-days: 30
