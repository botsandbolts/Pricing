name: Robust Bayesian hierarchy deployment
on:
  workflow_dispatch:
  push:
    paths: ['pricing/robust_hierarchy.py','scripts/compare_robust_bayes.py','scripts/install_robust_bayes.py','.github/workflows/robust-bayesian.yml']
concurrency:
  group: robust-bayesian-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        market: [ask, bid]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d6534b97830cde2ab1a01bfdab327bae9884226c
          path: baseline
          sparse-checkout: models/xgboost-hierarchy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' requests pytest
      - run: python -m pytest -q tests/test_robust_hierarchy.py
      - uses: actions/download-artifact@v4
        with:
          name: matched-bayesian-redesign-data
          run-id: 41230037897
          github-token: ${{ github.token }}
          path: evidence
      - run: python -m scripts.compare_robust_bayes --data evidence --output results --model-root baseline/models/xgboost-hierarchy --market '${{ matrix.market }}'
      - uses: actions/upload-artifact@v4
        with:
          name: robust-bayesian-${{ matrix.market }}
          path: results/
          retention-days: 90
  deploy:
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: robust-bayesian-*
          merge-multiple: true
          path: results
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'lightgbm>=4.5,<5' 'xgboost>=3,<4' streamlit==1.66.1 requests joblib onnxruntime 'tokenizers>=0.23.1,<0.24'
      - name: Install only passing posteriors and smoke-test both markets
        run: |
          git pull --ff-only origin main
          python -m scripts.install_robust_bayes --source results
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          import resource
          from pricing.hierarchy_sparse_live import estimate
          f=dict(year=2015,manufacturer='Toyota',model='Corolla',odometer=95000,state='ca',text='Full service history. Needs new tires.')
          results,_,_=estimate(Path('.'),f,date(2026,10,31),True)
          for side,r in results.items():
              assert 'error' not in r,(side,r)
              assert r['interval_low']<r['price']<r['interval_high']
              print(side,r['price'],r['interval_low'],r['interval_high'],flush=True)
          size=sum(p.stat().st_size for p in Path('models/xgboost-hierarchy').rglob('*') if p.is_file())
          rss=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          assert size<100*1024*1024,size
          assert rss<550*1024,rss
          print('SERVING VERIFIED',size,'bytes; peak',rss,'KiB',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: robust-bayesian-serving
          path: |
            models/xgboost-hierarchy/
            reports/robust-bayesian/
          retention-days: 90
      - name: Publish passing models
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A models/xgboost-hierarchy/ reports/robust-bayesian/
          git commit -m 'Deploy validation-selected nonlinear Bayesian posteriors and risk-stratified ranges'
          git pull --rebase origin main
          git push origin HEAD:main
