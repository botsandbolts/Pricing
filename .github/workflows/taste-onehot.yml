name: Rebuild and release common-category one-hot HDBSCAN with mileage
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: taste-geometry-release
  cancel-in-progress: false
jobs:
  rebuild-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pricing
            scripts
            tests
            assets
            marketbridge
            data/taste-garage
            models/time-transport
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' scikit-learn==1.8.0 'xgboost>=3.1,<4' hdbscan==0.8.44 faiss-cpu streamlit==1.66.1 requests pytest
      - run: python -m pytest tests/test_onehot_garage.py tests/test_taste_garage.py tests/test_taste_release_ui.py -q
      - run: python -u -m scripts.rebuild_onehot_garage --core-jobs 2
      - run: python -m scripts.verify_taste_release --bundle training-cache/taste-incremental/frozen-profiles.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: onehot-hdbscan-frozen-profiles
          path: training-cache/taste-incremental/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: onehot-hdbscan-verified-catalogue
          path: data/taste-garage/
          retention-days: 90
      - name: Publish matching verified assets
        run: |
          tar -cf "$RUNNER_TEMP/onehot-assets.tar" data/taste-garage
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf "$RUNNER_TEMP/onehot-assets.tar"
            git add data/taste-garage
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Install verified one-hot HDBSCAN with mileage and FAISS cosine"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
