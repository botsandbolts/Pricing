name: Verify Doc2Vec default discovery
on:
  push:
    paths:
      - 'pricing/merchant_discovery_ui.py'
      - 'scripts/check_doc2vec_ui.py'
      - '.github/workflows/doc2vec-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy<3' scipy pandas scikit-learn streamlit pytest requests
      - run: python -m pytest tests/test_merchant_reco.py -q
      - run: python -m scripts.check_doc2vec_ui
