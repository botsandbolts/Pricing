name: Overnight CVaR95 · all 109 candidate models + original Lemon XGBoost

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cvar95_all_candidates.py
      - tests/test_cvar95_all_candidates.py
      - .github/workflows/overnight-cvar95-all-models.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: cvar95-all-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tiny evaluation test dependencies, not any trainer
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' pytest
      - name: Compile and test CVaR95 exact-tail and original holdout contracts
        run: |
          python -m compileall -q scripts/cvar95_all_candidates.py scripts/cvar95_historical.py
          python -m pytest -q tests/test_cvar95_all_candidates.py tests/test_cvar95_historical.py

  bid_all:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only original inference and evaluation dependencies
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib
      - name: Collect all 26 trained full/Lemon FM and DeepFM original validation outputs
        uses: actions/download-artifact@v4
        with:
          pattern: bid-fm-scale-*
          run-id: 42279280866
          github-token: ${{ github.token }}
          path: training-cache/cvar95-arms/fm26
          merge-multiple: false
      - name: Collect all ten earlier FM, FFM, kernel original validation outputs
        uses: actions/download-artifact@v4
        with:
          pattern: bid-fm-kernel-*
          run-id: 42275395253
          github-token: ${{ github.token }}
          path: training-cache/cvar95-arms/fm10
          merge-multiple: false
      - name: Collect all 29 FT-Transformer original validation outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ft-bid-tune-*
          run-id: 42256103702
          github-token: ${{ github.token }}
          path: training-cache/cvar95-arms/ft29
          merge-multiple: false
      - name: Recover original frozen 2015 wholesale auction features
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Recover CURRENT Lemon XGBoost bid original VIN-disjoint validation/test predictions
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: CVaR95 validation rank 65 arms plus 455 blends, test only preselected winner(s)
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -u -m scripts.cvar95_all_candidates \
            --market bid \
            --baseline benchmark-reference/bid/predictions.csv.gz \
            --output reports/cvar95/all-candidates/bid
      - uses: actions/upload-artifact@v4
        with:
          name: original-validation-cvar95-65-bid-models
          path: reports/cvar95/all-candidates/bid/
          retention-days: 90
          if-no-files-found: error
      - name: Publish independently checked CVaR95 bid leaderboard
        run: |
          cp -a reports/cvar95/all-candidates/bid "$RUNNER_TEMP/bid-cvar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/cvar95/all-candidates/bid
            cp -a "$RUNNER_TEMP/bid-cvar/." reports/cvar95/all-candidates/bid/
            git add reports/cvar95/all-candidates/bid/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish CVaR95-first validation ranking of all 65 bid models and paired Lemon XGBoost'
            git push origin HEAD:main && exit 0
          done
          exit 1

  ask_all:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation-only stack
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Collect eight raw BGE/GTE/MiniLM/DistilRoBERTa direct-embedding model validations
        uses: actions/download-artifact@v4
        with:
          pattern: raw-ask-trained-*
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/cvar95-arms/bge8
          merge-multiple: false
      - name: Collect 36 completed old DeepCross AFT training arms and saved holdouts
        uses: actions/download-artifact@v4
        with:
          pattern: deepcross-aft-tune-*
          run-id: 42252201025
          github-token: ${{ github.token }}
          path: training-cache/cvar95-arms/deepcross36
          merge-multiple: false
      - name: Recover CURRENT original XGBoost Lemon asking prices on identical 2021 listings
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-ask
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Rank 44 complete asking-price challengers by validation CVaR95
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -u -m scripts.cvar95_all_candidates \
            --market ask \
            --baseline benchmark-reference/ask/predictions.csv.gz \
            --output reports/cvar95/all-candidates/ask
      - uses: actions/upload-artifact@v4
        with:
          name: original-validation-cvar95-44-asking-models
          path: reports/cvar95/all-candidates/ask/
          retention-days: 90
          if-no-files-found: error
      - name: Publish independent CVaR95 original asking vehicle results
        run: |
          cp -a reports/cvar95/all-candidates/ask "$RUNNER_TEMP/ask-cvar"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/cvar95/all-candidates/ask
            cp -a "$RUNNER_TEMP/ask-cvar/." reports/cvar95/all-candidates/ask/
            git add reports/cvar95/all-candidates/ask/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish CVaR95-first validation ranking of all 44 asking models and matched Lemon XGBoost'
            git push origin HEAD:main && exit 0
          done
          exit 1
