name: Low-memory Captum · real model head and public GUI QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/captum-price-qa.yml
      - pricing/captum_price_lite.py
      - pricing/neural_experimental_ui.py
      - tests/test_captum_price_lite.py
      - scripts/browser_smoke_main_pricing.py
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: captum-price-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  real_captum_integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Captum (not a mock), CPU PyTorch, low-weight test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'captum==0.9.0' 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'xgboost>=3,<4' 'pytest>=8,<10' 'streamlit==1.66.1' 'plotly>=5.24,<7' 'joblib>=1.3,<2'
      - name: Compile and validate real production entrypoints
        run: |
          python -m compileall -q app.py pricing/captum_price_lite.py pricing/neural_experimental_ui.py tests/test_captum_price_lite.py
      - name: Real Captum gradients and immutable Ask/Bid model contracts
        run: |
          mkdir -p reports/qa/captum
          python -m pytest -q \
            tests/test_captum_price_lite.py \
            tests/test_main_pricing_campaign.py \
            tests/test_experimental_two_models.py \
            tests/test_cvar95_champion_release.py \
            --junitxml reports/qa/captum/junit.xml
      - name: Enforce strict memory and provenance contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          x=Path('pricing/captum_price_lite.py').read_text()
          ui=Path('pricing/neural_experimental_ui.py').read_text()
          assert 'internal_batch_size=1' in x
          assert 'n_steps=steps' in x
          assert 'steps != INTEGRATION_STEPS' in x
          assert 'INTEGRATION_STEPS=24' in x
          assert 'st.select_slider(' not in x
          assert 'return_convergence_delta=True' in x
          assert 'from captum.attr import IntegratedGradients' in x
          assert 'torch.load(' not in x and 'subprocess.run(' not in x
          assert 'model.prepare_text(' not in x
          assert 'model.predict_prepared(fields,prepared)' in ui
          assert 'results["ask_embedding"]=prepared["embedding"]' in ui
          assert 'results["bid_fields"]=bid_fields' in ui
          assert 'load_champion_ask(root) if ask_champion' in ui
          assert 'load_champion_bid(root) if bid_champion' in ui
          print('One native cached model, one vehicle, one small autograd graph at a time')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captum-real-integrated-gradients-test-report
          path: reports/qa/captum/junit.xml
          retention-days: 30
          if-no-files-found: warn

  five_browser_page:
    needs: real_captum_integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install page rendering stack and real browsers
        run: |
          python -m pip install 'streamlit==1.66.1' 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'requests>=2.31,<3' 'plotly>=5.24,<7' 'playwright>=1.55,<2' 'xgboost>=3,<4' 'catboost==1.2.10' 'lightgbm>=4.5,<5' 'joblib>=1.3,<2'
          # The main page must render without importing Captum or downloading
          # another PyTorch wheel. Actual Captum gradients were tested above.
          python -m playwright install --with-deps chromium firefox webkit
      - name: Start the actual app in Streamlit
        run: |
          python -m streamlit run app.py --server.port 8765 --server.address 127.0.0.1 --server.headless true >/tmp/captum-streamlit.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          for _ in range(70):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/_stcore/health',timeout=2) as r:
                      if r.status==200:
                          print('Healthy HTTP service')
                          break
              except Exception:time.sleep(2)
          else:raise SystemExit('Streamlit startup failed')
          PY
      - name: Browser QA · desktop, tablet, Android, iPhone, Firefox
        run: |
          python -u scripts/browser_smoke_main_pricing.py \
            --base http://127.0.0.1:8765 \
            --output reports/qa/captum/browsers
      - name: Preserve failures and screenshots
        if: always()
        run: |
          mkdir -p reports/qa/captum/browsers
          cp /tmp/captum-streamlit.log reports/qa/captum/browsers/streamlit.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captum-five-browser-page-smoke
          path: reports/qa/captum/browsers
          retention-days: 30
          if-no-files-found: warn
