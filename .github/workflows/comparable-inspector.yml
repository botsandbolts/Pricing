name: Comparable Inspector checks and description index
on:
  workflow_dispatch:
  push:
    paths:
      - 'pricing/comparable_*.py'
      - 'pricing/retrieval_imputation.py'
      - 'pricing/vehicle_presets.py'
      - 'scripts/build_retrieval_imputation.py'
      - 'scripts/build_vehicle_presets.py'
      - 'pricing/listing_inspector.py'
      - 'scripts/build_comparable_semantics.py'
      - 'scripts/benchmark_comparables.py'
      - 'tests/test_comparable_retrieval.py'
      - '.github/workflows/comparable-inspector.yml'
permissions:
  contents: write
concurrency:
  group: comparable-inspector
  cancel-in-progress: false
jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pricing
            marketbridge
            scripts
            tests
            data
            models/time-transport
            models/xgboost-hierarchy/ask/minilm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' scikit-learn==1.8.0 'pandas>=2.1,<3' streamlit==1.66.1 pytest onnxruntime tokenizers 'faiss-cpu>=1.8,<2' 'lightgbm>=4.5,<5'
      - run: python -m scripts.build_vehicle_presets
      - run: python -m pytest tests/test_comparable_retrieval.py -q
      - run: python -m scripts.build_retrieval_imputation
      - run: python -m scripts.build_comparable_semantics
      - name: Verify real semantic matching
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from pricing.comparable_retrieval import ComparableIndex,reference_rows
          from pricing.comparable_semantics import attach,encode_query
          root=Path('.')
          from pricing.retrieval_imputation import load as load_imputer
          rows=reference_rows(root,'ask')
          index=ComparableIndex(rows,imputer=load_imputer(root,'ask',rows))
          assert attach(index,root)
          q=index.rows[0]
          vector=encode_query(root,q['description'])
          matches=index.search(q,description_vector=vector,exclude_id=q['id'])
          assert np.isfinite(vector).all()
          assert all(m['vehicle']['id']!=q['id'] for m in matches)
          from streamlit.testing.v1 import AppTest
          from pricing import inspector_estimate
          inspector_estimate.quote=lambda root,fields,notes,date,allow:dict(fields=fields,notes=notes,date=str(date),model_version='',results={})
          at=AppTest.from_string("from pathlib import Path\nfrom pricing.listing_inspector import render\nrender(Path('.'))").run(timeout=60)
          at.text_area[0].set_value('Full service history. Needs new tires.')
          at.button[0].click().run(timeout=60)
          assert not at.exception
          assert any(c.value=='MiniLM description similarity included.' for c in at.caption)
          print('Real MiniLM query and UI passed')
          PY
      - name: Publish compact reference assets without overwriting newer catalogues
        run: |
          python - <<'PYREF'
          import hashlib,json
          from pathlib import Path
          paths=['data/comparable-catalog/ask.json.gz','data/description-examples.json','data/deal-reference.json.gz']
          values={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() if Path(p).exists() else None for p in paths}
          Path('/tmp/reference-inputs.json').write_text(json.dumps(values))
          PYREF
          tar -cf "$RUNNER_TEMP/comparable-assets.tar" data/comparable-minilm data/retrieval-imputation data/vehicle-examples.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! python - <<'PYREF'
          import hashlib,json
          from pathlib import Path
          before=json.loads(Path('/tmp/reference-inputs.json').read_text())
          after={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() if Path(p).exists() else None for p in before}
          raise SystemExit(0 if before==after else 1)
          PYREF
            then
              echo 'A newer reference catalogue is installed; keeping its consistent assets.'
              exit 0
            fi
            tar -xf "$RUNNER_TEMP/comparable-assets.tar"
            git add data/comparable-minilm data/retrieval-imputation data/vehicle-examples.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Install tested MiniLM, imputation and specific-vehicle reference assets"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
