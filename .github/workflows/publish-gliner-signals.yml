name: Publish original GLiNER dealer signals
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish_gliner_signals.py'
      - '.github/workflows/publish-gliner-signals.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-gliner-signals
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy<3' scipy scikit-learn streamlit pytest requests
      - uses: actions/download-artifact@v4
        with:
          name: complete-gliner-merchant-names
          run-id: 41602344245
          github-token: ${{ github.token }}
          path: training-cache/gliner-merchants
      - run: python -m scripts.publish_gliner_signals
      - run: python -m pytest tests/test_dealer_signals.py tests/test_session_pairwise.py tests/test_merchant_reco.py -q
      - run: python -m scripts.check_doc2vec_ui
      - uses: actions/upload-artifact@v4
        with:
          name: original-gliner-serving-signals
          path: data/merchant-discovery-minilm/dealers.json
      - name: Publish tested dealer signals
        run: |
          cp data/merchant-discovery-minilm/dealers.json "$RUNNER_TEMP/dealers.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/dealers.json" data/merchant-discovery-minilm/dealers.json
            git add data/merchant-discovery-minilm/dealers.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish original confidence-weighted GLiNER dealer identities for 110832 adverts"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
