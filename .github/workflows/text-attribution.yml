name: Direct text attribution checks
on:
  push:
    paths: ['pricing/text_attribution*.py', 'tests/test_text_attribution.py', 'scripts/common.py', '.github/workflows/text-attribution.yml']
  pull_request:
    paths: ['pricing/text_attribution*.py', 'tests/test_text_attribution.py', 'scripts/common.py', '.github/workflows/text-attribution.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pricing
            tests
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'streamlit==1.66.1' 'plotly>=5.24,<7'
      - run: python -m pytest tests/test_text_attribution.py -q
