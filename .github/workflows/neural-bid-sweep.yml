name: Regularized neural auction bid - 18 arm sweep

on:
  pull_request:
    paths:
      - scripts/neural_bid_*.py
      - pricing/neural_bid_ui.py
      - pricing/suite_ui.py
      - tests/test_neural_bid.py
      - .github/workflows/neural-bid-sweep.yml
  push:
    branches: [main]
    paths:
      - scripts/neural_bid_*.py
      - pricing/neural_bid_ui.py
      - pricing/suite_ui.py
      - tests/test_neural_bid.py
      - .github/workflows/neural-bid-sweep.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: neural-auction-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "scipy>=1.11,<2" "lightgbm>=4,<5" pytest
      - name: Check syntax and dataset/score guardrail tests
        run: |
          python -m compileall -q scripts/neural_bid_prepare.py scripts/neural_bid_train.py scripts/neural_bid_report.py pricing/neural_bid_ui.py
          python -m pytest tests/test_neural_bid.py -q

  prepare:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=15,<25"
      - name: Recover FROZEN train-only Lemon membership (never recompute on test)
        uses: actions/download-artifact@v4
        with:
          name: matched-bayesian-redesign-data
          run-id: 41230037897
          github-token: ${{ github.token }}
          path: evidence
      - name: Freeze original wholesale auction cohort and Lemon row IDs from archived evidence
        run: python -u -m scripts.neural_bid_prepare
      - uses: actions/upload-artifact@v4
        with:
          name: neural-bid-frozen-features
          path: |
            training-cache/neural-bid/features.npz
            training-cache/neural-bid/features.json
            training-cache/neural-bid/canonical-bid.parquet
          retention-days: 90
          if-no-files-found: error

  train:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        architecture: [resmlp, deepcross, fttransformer]
        loss: [huber, quantile50, aft]
        cohort: [full, lemon]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and independent metrics stack
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2"
      - uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          path: training-cache/neural-bid
      - name: Fit one regularized bid auction neural architecture and loss
        run: |
          python -u -m scripts.neural_bid_train \
            --arch ${{ matrix.architecture }} \
            --loss ${{ matrix.loss }} \
            --cohort ${{ matrix.cohort }} \
            --output "training-cache/neural-bid-results/${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}"
      - uses: actions/upload-artifact@v4
        with:
          name: neural-bid-result-${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}
          path: training-cache/neural-bid-results/${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}/
          retention-days: 90
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2"
      - name: Collect ALL model outcomes and heldout predictions
        uses: actions/download-artifact@v4
        with:
          pattern: neural-bid-result-*
          path: training-cache/neural-bid-results
          merge-multiple: false
      - name: Recover frozen XGBoost Lemon reference predictions for paired test
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Audit exact original auction sale targets and report all 18 arms
        run: python -u -m scripts.neural_bid_report --reference benchmark-reference/bid/predictions.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: neural-bid-verified-comparison
          path: reports/neural-bid-benchmark/
          retention-days: 90
          if-no-files-found: error
      - name: Publish only verified compact results, never large weights
        run: |
          cp -a reports/neural-bid-benchmark "$RUNNER_TEMP/neural-bid-benchmark"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/neural-bid-benchmark
            cp -a "$RUNNER_TEMP/neural-bid-benchmark/." reports/neural-bid-benchmark/
            git add reports/neural-bid-benchmark/
            git diff --cached --quiet && exit 0
            git commit -m "Publish audited 18-arm neural wholesale bid benchmark"
            git push origin HEAD:main && exit 0
          done
          exit 1
