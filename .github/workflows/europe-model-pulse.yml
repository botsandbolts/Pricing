name: European make-model month evidence · SGD Huber

on:
  push:
    branches:
      - feature/europe-model-level-price-evidence-20261110
    paths:
      - scripts/build_europe_model_pulse.py
      - pricing/europe_bayes_pulse.py
      - pricing/europe_model_pulse.py
      - pricing/europe_market.py
      - tests/test_europe_model_pulse.py
      - .github/workflows/europe-model-pulse.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "requests>=2.31,<3" "pytest>=8,<10" "pyarrow>=17,<24"
      - name: Regression tests and compile
        run: |
          python -m py_compile scripts/build_europe_model_pulse.py pricing/europe_model_pulse.py pricing/europe_bayes_pulse.py pricing/europe_market.py
          python -m pytest -q tests/test_europe_model_pulse.py tests/test_europe_price_clock.py tests/test_europe_eurostat.py

  build-observations:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "pyarrow>=17,<24"
      - name: Compute make/model differences from real listing-date observations
        run: python -m scripts.build_europe_model_pulse
      - uses: actions/upload-artifact@v4
        with:
          name: eu-make-model-monthly-research-only
          path: models/europe-ask/model_pulse.json
      - name: Publish research-only pilot on branch (never overwrite live index)
        if: github.ref == 'refs/heads/feature/europe-model-level-price-evidence-20261110'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/europe-ask/model_pulse.json
          git diff --cached --quiet || git commit -m "Package observed make/model research pulse; not a live pricing factor"
          git pull --rebase origin feature/europe-model-level-price-evidence-20261110
          git push origin HEAD:feature/europe-model-level-price-evidence-20261110
