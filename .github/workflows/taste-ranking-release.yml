name: Verify soft ranking and FAISS L1 and 25-profile release
on:
  workflow_dispatch:
  push:
    paths:
      - 'pricing/taste_*.py'
      - 'scripts/assign_taste_listings.py'
      - 'scripts/verify_taste_release.py'
      - 'scripts/build_long_taste.py'
      - 'tests/test_taste_garage.py'
      - '.github/workflows/taste-ranking-release.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: taste-ranking-release
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' scikit-learn==1.8.0 'xgboost>=3.1,<4' hdbscan==0.8.44 faiss-cpu streamlit==1.66.1 requests pytest
      - run: python -m pytest tests/test_taste_garage.py -q
      - uses: actions/download-artifact@v4
        with:
          name: frozen-hdbscan-daily-listing-prediction
          run-id: 41344075483
          github-token: ${{ github.token }}
          path: training-cache/taste-incremental
      - name: Reuse frozen clusters; test FAISS, 10/25 profiles, nonconstant ranking and both UIs
        run: python -m scripts.verify_taste_release --bundle training-cache/taste-incremental/frozen-profiles.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: verified-faiss-soft-ranking
          path: data/taste-garage/release-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-hdbscan-25-daily-listing-prediction
          path: training-cache/taste-incremental/frozen-profiles-25.joblib
          retention-days: 90
      - name: Publish verified assets
        run: |
          tar -cf "$RUNNER_TEMP/taste-assets.tar" data/taste-garage
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf "$RUNNER_TEMP/taste-assets.tar"
            git add data/taste-garage
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish verified nonconstant soft ranking and FAISS L1 and 25-profile evidence"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
