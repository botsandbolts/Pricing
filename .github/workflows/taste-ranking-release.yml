name: Test recommender code without overwriting trained catalogues
on:
  workflow_dispatch:
  push:
    paths:
      - 'pricing/taste_*.py'
      - 'scripts/assign_taste_listings.py'
      - 'scripts/verify_taste_release.py'
      - 'scripts/taste_ui_check.py'
      - 'scripts/build_long_taste.py'
      - 'scripts/build_mixed_garage.py'
      - 'scripts/prepare_lemon_reco.py'
      - 'scripts/verify_mixed_garage.py'
      - 'tests/test_umap_garage.py'
      - 'tests/test_taste*.py'
      - 'tests/test_onehot_garage.py'
      - 'tests/test_mixed_garage.py'
      - 'pricing/mixed_garage.py'
      - '.github/workflows/taste-ranking-release.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pricing
            scripts
            tests
            assets
            marketbridge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' scikit-learn==1.8.0 'xgboost>=3.1,<4' hdbscan==0.8.44 faiss-cpu streamlit==1.66.1 requests pytest umap-learn==0.5.9.post2
      - run: python -m pytest tests/test_onehot_garage.py tests/test_mixed_garage.py tests/test_umap_garage.py tests/test_taste_garage.py tests/test_taste_release_ui.py -q
