name: Firefox EU/US release gate - desktop and Android viewport

on:
  push:
    branches: [main, feature/europe-us-studio-20261109]
    paths:
      - 'models/europe-ask/**'
      - 'app.py'
      - 'pricing/europe_*.py'
      - 'pricing/international_gateway.py'
      - 'assets/europe_parody_*.svg'
      - 'assets/europe_parody_*.webp'
      - 'tests/firefox_europe_e2e.py'
      - '.github/workflows/europe-firefox-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-europe-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify complete model packaging is present
        id: bundle
        run: |
          if test -f models/europe-ask/winner.ubj && \
             test -f models/europe-ask/schema.json; then
            echo 'present=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'present=no' >> "$GITHUB_OUTPUT"
            echo 'Model not packaged yet. Full Firefox verification deferred to model commit.'
          fi
      - name: Install exactly the production application runtime
        if: steps.bundle.outputs.present == 'yes'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright>=1.55,<2' 'pytest>=8,<10'
      - name: Install genuine Firefox with Linux dependencies
        if: steps.bundle.outputs.present == 'yes'
        run: python -m playwright install --with-deps firefox
      - name: Verify model and release regression checks
        if: steps.bundle.outputs.present == 'yes'
        run: |
          python -m pytest -q tests/test_europe_market.py
          python -m compileall -q app.py pricing/europe_market.py pricing/europe_model.py pricing/international_gateway.py
      - name: Launch real Streamlit server and inspect in Firefox
        if: steps.bundle.outputs.present == 'yes'
        run: |
          (python -m streamlit run app.py --server.headless true \
            --server.address 127.0.0.1 --server.port 8507 \
            --browser.gatherUsageStats false > /tmp/europe_streamlit.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8507/_stcore/health; then break; fi
            sleep 2
          done
          python -u tests/firefox_europe_e2e.py || { cat /tmp/europe_streamlit.log; exit 1; }
      - name: Upload actual Firefox desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-europe-release-evidence
          path: artifacts/firefox-europe/
          if-no-files-found: warn
          retention-days: 30
