name: Train temporary soft MiniBatchKMeans garage
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_kmeans_garage.py'
      - 'scripts/verify_kmeans_garage.py'
      - '.github/workflows/taste-kmeans.yml'
permissions:
  contents: write
concurrency:
  group: taste-geometry-release
  cancel-in-progress: false
jobs:
  rebuild-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pricing
            scripts
            tests
            assets
            marketbridge
            data/taste-garage-mixed
            data/taste-garage
            models/time-transport
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' scikit-learn==1.8.0 'xgboost>=3.1,<4' hdbscan==0.8.44 faiss-cpu streamlit==1.66.1 umap-learn==0.5.9.post2 requests pytest
      - run: python -m pytest tests/test_direct_garage.py tests/test_onehot_garage.py tests/test_mixed_garage.py tests/test_umap_garage.py tests/test_taste_garage.py tests/test_taste_release_ui.py -q
      - name: Reuse exact retained dataset and its existing scalar text prices
        run: python -m scripts.prepare_lemon_reco --from-catalogue
      - run: python -u -m scripts.build_kmeans_garage --jobs 2
      - run: python -m scripts.verify_kmeans_garage
      - uses: actions/upload-artifact@v4
        with:
          name: direct-euclidean-hdbscan-frozen-profiles
          path: training-cache/lemon-mixed/frozen-profiles-*.joblib
          retention-days: 90
      - name: Publish matching verified assets and release pointer
        run: |
          tar -cf "$RUNNER_TEMP/mixed-assets.tar" data/taste-garage-mixed data/taste-garage-release.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            tar -xf "$RUNNER_TEMP/mixed-assets.tar"
            git add data/taste-garage-mixed data/taste-garage-release.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Install verified direct mixed Manhattan HDBSCAN without UMAP"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
