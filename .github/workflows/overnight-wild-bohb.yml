name: Overnight WILD BOHB · 32 Ask / 26 Bid knobs · 06:00 CET cutoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/overnight-wild-bohb.yml
      - scripts/overnight_bohb.py
      - scripts/overnight_bohb_neural.py
      - scripts/overnight_bohb_losses.py
      - tests/test_overnight_bohb.py

permissions:
  actions: read
  contents: read

concurrency:
  group: overnight-wild-bohb-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify multi-loss gradients, 32-dimensional BOHB, budgets and deadline
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2' 'pandas>=2.1,<3' pytest
          python -m compileall -q scripts/overnight_bohb.py scripts/overnight_bohb_neural.py scripts/overnight_bohb_losses.py tests/test_overnight_bohb.py
          python -m pytest -q tests/test_overnight_bohb.py

  propose_0:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      go: ${{ steps.deadline_gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HpBandSter adaptive coordinator
        run: python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2'
      - name: KDE proposes four unseen Ask and four unseen Bid configurations
        run: |
          python -u -m scripts.overnight_bohb propose --stage 0 --output proposal/plan.json
      - id: deadline_gate
        name: Authorize only batches that start before 06:00 Berlin
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan=json.load(open("proposal/plan.json"))
          print("go="+str(plan["status"]=="ready").lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-plan-0
          path: proposal/plan.json
          retention-days: 60
          if-no-files-found: error

  train_0:
    needs: propose_0
    if: ${{ needs.propose_0.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        market: [ask, bid]
        slot: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU neural trainers, HpBandSter, and audit tools
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib
      - uses: actions/download-artifact@v4
        with:
          name: overnight-plan-0
          path: proposal
      - name: Reuse original SHA-pinned 2021 Ask training cohort
        if: ${{ matrix.market == 'ask' }}
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Reuse original BGE embeddings, never re-encode per trial
        if: ${{ matrix.market == 'ask' }}
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/bge-256
      - name: Reuse original VIN-disjoint 2015 Bid training cohort
        if: ${{ matrix.market == 'bid' }}
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Reuse unchanged matched Lemon XGBoost Bid baseline
        if: ${{ matrix.market == 'bid' }}
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Train native candidate, prune on internal TRAIN CVaR95, validate surviving model once
        run: |
          python -u -m scripts.overnight_bohb train \
            --plan proposal/plan.json \
            --market "${{ matrix.market }}" \
            --slot "${{ matrix.slot }}" \
            --max-seconds 3000 \
            --output training-results/adaptive
      - name: Preserve original validation predictions and native checkpoint, if audited
        uses: actions/upload-artifact@v4
        with:
          name: overnight-result-s0-${{ matrix.market }}-${{ matrix.slot }}
          path: training-results/adaptive/
          retention-days: 7
          compression-level: 4
          if-no-files-found: error

  collect_0:
    needs: [propose_0, train_0]
    if: ${{ needs.propose_0.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent metrics and CVaR95 audit dependencies
        run: |
          python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3'
      - uses: actions/download-artifact@v4
        with:
          name: overnight-plan-0
          path: proposal
      - name: Retrieve eight original candidate or complete receipts
        uses: actions/download-artifact@v4
        with:
          pattern: overnight-result-s0-*
          path: candidate-results
          merge-multiple: false
      - name: Audit all 8 candidates and publish next-stage BOHB training evidence
        run: |
          python -u -m scripts.overnight_bohb collect \
            --plan proposal/plan.json \
            --artifacts candidate-results \
            --output findings/history.json
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-history-0
          path: findings/history.json
          retention-days: 90
          if-no-files-found: error

  propose_1:
