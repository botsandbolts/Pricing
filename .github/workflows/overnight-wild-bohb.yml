  final_report:
    needs: [collect_0, collect_1, collect_2, collect_3, collect_4, collect_5, collect_6, collect_7, collect_8, collect_9, collect_10, collect_11, collect_12, collect_13, collect_14, collect_15, collect_16, collect_17, collect_18, collect_19, collect_20, collect_21, collect_22, collect_23, collect_24, collect_25, collect_26, collect_27, collect_28, collect_29]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover every audited stage; skipped batches after cutoff are expected
        uses: actions/download-artifact@v4
        with:
          pattern: overnight-history-*
          path: histories
          merge-multiple: false
      - name: Print exact last audited head-to-head CVaR95/MAE/RMSE results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("histories").glob("overnight-history-*/history.json"))
          if not files:
              raise SystemExit("No audited stage; inspect earlier job errors")
          latest=max(files,key=lambda p:int(p.parent.name.rsplit("-",1)[1]))
          report=json.loads(latest.read_text())
          print("Last audited:",latest,"trials:",len(report["records"]))
          print("Deadline:",report["deadline_utc"])
          print("No deployment or test-set use:",report["not_for_deployment"],not report["test_evaluated"])
          assert report["not_for_deployment"] and not report["test_evaluated"]
          for market in ("ask","bid"):
              print("\n",market.upper(),"budget counts",report["budget_distribution"][market])
              incumbent=report["compared_to_deployed_verified"][market]
              for metric,values in incumbent["metrics"].items():
                  print(metric,"incumbent",values["incumbent"],"best full-fidelity challenger",values["challenger"],"USD saved",values["saved_usd"])
              print("Full 216-epoch challenge beats incumbent CVaR95:",incumbent["challenger_beats_incumbent_on_CVaR95"])
          Path("nightmare-final-comparison.json").write_text(json.dumps(report,indent=2))
          PY
      - name: Persist independent audit; never promote experimental models
        uses: actions/upload-artifact@v4
        with:
