name: Regularized neural asking price - 18 arm sweep

on:
  pull_request:
    paths:
      - scripts/neural_ask_*.py
      - pricing/neural_ask_ui.py
      - pricing/suite_ui.py
      - tests/test_neural_ask.py
      - .github/workflows/neural-ask-sweep.yml
  push:
    branches: [main]
    paths:
      - scripts/neural_ask_*.py
      - pricing/neural_ask_ui.py
      - pricing/suite_ui.py
      - tests/test_neural_ask.py
      - .github/workflows/neural-ask-sweep.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: neural-asking-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "scipy>=1.11,<2" pytest
      - name: Check syntax and dataset/score guardrail tests
        run: |
          python -m compileall -q scripts/neural_ask_prepare.py scripts/neural_ask_train.py scripts/neural_ask_report.py pricing/neural_ask_ui.py
          python -m pytest tests/test_neural_ask.py -q

  prepare:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "scipy>=1.11,<2"
      - name: Recover FROZEN train-only Lemon membership (never recompute on test)
        uses: actions/download-artifact@v4
        with:
          name: matched-bayesian-redesign-data
          run-id: 41230037897
          github-token: ${{ github.token }}
          path: evidence
      - name: Download authentic original Craigslist archive and verify checksum
        run: |
          mkdir -p training-cache
          curl --fail --location --retry 5 --retry-delay 15 \
            --output training-cache/ask.zip \
            "https://zenodo.org/records/10457828/files/Used%20Cars%20Dataset.zip?download=1"
          echo "eb2ad6c7dedd3c73ffed4bf47929ab66e55d7da186ed240230caa1fad85d2e8f  training-cache/ask.zip" | sha256sum -c -
      - name: Reconstruct original canonical chronological cohort
        run: python -u -m scripts.prepare_full training-cache/ask.zip --output training-cache/full-cohort.jsonl --workers 2
      - name: Fit train-only label-free text SVD and frozen cohort membership
        run: python -u -m scripts.neural_ask_prepare --lemon-csv evidence/ask-minilm-cleaned.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: neural-ask-frozen-features
          path: |
            training-cache/neural-ask/features.npz
            training-cache/neural-ask/features.json
          retention-days: 90
          if-no-files-found: error

  train:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        architecture: [resmlp, deepcross, fttransformer]
        loss: [huber, quantile50, aft]
        cohort: [full, lemon]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch and independent metrics stack
        run: |
          python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2"
      - uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          path: training-cache/neural-ask
      - name: Fit regularized architecture and objective on one frozen treatment
        run: |
          python -u -m scripts.neural_ask_train \
            --arch ${{ matrix.architecture }} \
            --loss ${{ matrix.loss }} \
            --cohort ${{ matrix.cohort }} \
            --output "training-cache/neural-results/${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}"
      - uses: actions/upload-artifact@v4
        with:
          name: neural-ask-result-${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}
          path: training-cache/neural-results/${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}/
          retention-days: 90
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2"
      - name: Collect ALL model outcomes and heldout predictions
        uses: actions/download-artifact@v4
        with:
          pattern: neural-ask-result-*
          path: training-cache/neural-results
          merge-multiple: false
      - name: Recover frozen XGBoost Lemon reference predictions for paired test
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-ask
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Audit identical row IDs, original prices and report all 18 arms
        run: python -u -m scripts.neural_ask_report --reference benchmark-reference/ask/predictions.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: neural-ask-verified-comparison
          path: reports/neural-ask-benchmark/
          retention-days: 90
          if-no-files-found: error
      - name: Publish only verified compact results, never large weights
        run: |
          cp -a reports/neural-ask-benchmark "$RUNNER_TEMP/neural-ask-benchmark"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/neural-ask-benchmark
            cp -a "$RUNNER_TEMP/neural-ask-benchmark/." reports/neural-ask-benchmark/
            git add reports/neural-ask-benchmark/
            git diff --cached --quiet && exit 0
            git commit -m "Publish audited 18-arm neural asking benchmark"
            git push origin HEAD:main && exit 0
          done
          exit 1
