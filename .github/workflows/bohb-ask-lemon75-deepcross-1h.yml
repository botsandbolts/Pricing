name: BOHB Ask · one-hour Lemon75 DeepCross extended AFT loss research

on:
  push:
    branches:
      - experiment/bohb-ask-lemon75-deepcross-1h-20261108
    paths:
      - .github/workflows/bohb-ask-lemon75-deepcross-1h.yml
      - scripts/bohb_ask_lemon75_deepcross_1h.py
      - tests/test_bohb_ask_lemon75_deepcross_1h.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bohb-ask-lemon75-deepcross-1h-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real HpBandSter BOHB, frozen Ask model dependencies and pytest
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' pytest
      - name: Compile and test exact loss, BOHB search space, safety gates and train isolation
        run: |
          python -m compileall -q scripts/bohb_ask_lemon75_deepcross_1h.py tests/test_bohb_ask_lemon75_deepcross_1h.py
          python -m pytest -q tests/test_bohb_ask_lemon75_deepcross_1h.py

  search:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 82
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CPU BOHB extended AFT research environment
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' pyarrow
      - name: Restore immutable training cohort and original pre-existing Lemon mask
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Restore original pinned frozen BGE-256 384D embeddings
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/bge-256
      - name: Restore separate original reference for Lemon-cleaned validation membership
        uses: actions/download-artifact@v4
        with:
          name: matched-bayesian-redesign-data
          run-id: 41230037897
          github-token: ${{ github.token }}
          path: training-cache/pre-lemon-reference
      - name: Run 3,600-second BOHB DeepCross study; training selected from Lemon TRAIN only
        run: |
          test -s training-cache/neural-ask/features.npz
          test -s training-cache/bge-256/embeddings.npy
          test -s training-cache/pre-lemon-reference/ask-minilm-oof.csv.gz
          python -u -m scripts.bohb_ask_lemon75_deepcross_1h \
            --architecture deepcross \
            --features training-cache/neural-ask/features.npz \
            --embeddings training-cache/bge-256 \
            --reference training-cache/pre-lemon-reference/ask-minilm-oof.csv.gz \
            --search-seconds 3600 --reserve-seconds 160 \
            --output reports/bohb-ask-lemon75-1h
      - name: Independent clean Lemon validation audit of 23,751 reference-retained cars
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          from scripts.cvar95_historical import risk
          folder=Path('reports/bohb-ask-lemon75-1h')
          result=json.loads((folder/'result.json').read_text())
          assert result['status']=='completed'
          assert result['architecture']=='deepcross'
          assert result['search_seconds']==3600
          assert result['original_test_scored'] is False
          assert result['auto_deploy'] is False
          assert result['original_validation_selection'] is False
          assert result['lemon_validation_rows']==23751
          assert result['excluded_original_validation_rows']==7917
          assert result['lemon_validation_not_unbiased_future_accuracy'] is True
          assert result['trials_completed']>0
          assert (folder/'weights.pt').is_file()
          df=pd.read_csv(folder/'validation.csv.gz',dtype={'row_id':str})
          assert len(df)==23751 and df.row_id.is_unique
          assert df.split.eq('lemon_validation').all()
          scores=risk(df.observed_price.to_numpy(float),
                      df.predicted_price.to_numpy(float))
          for key in ('CVaR95_absolute_USD','MAE_USD','RMSE_USD'):
            assert abs(scores[key]-result['lemon_validation'][key])<.1,key
          print('BOHB_LEMON75_INDEPENDENT_VALIDATION',json.dumps({
            'metrics':scores,'parent_ray_retained_CVaR95_USD':
            result['source_ray_retained_validation_CVaR95_USD'],
            'improves_parent':scores['CVaR95_absolute_USD']<
                 result['source_ray_retained_validation_CVaR95_USD'],
            'test_scored':False,'auto_deploy':False}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bohb-ask-lemon75-deepcross-1h-results
          path: |
            reports/bohb-ask-lemon75-1h/status.json
            reports/bohb-ask-lemon75-1h/history.json
            reports/bohb-ask-lemon75-1h/result.json
            reports/bohb-ask-lemon75-1h/weights.pt
            reports/bohb-ask-lemon75-1h/validation.csv.gz
          retention-days: 90
          if-no-files-found: warn
