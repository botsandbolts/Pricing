name: Promote verified European ResMLP to main

on:
  push:
    branches: [feature/europe-resmlp-live-20261110]
    paths:
      - '.github/workflows/europe-resmlp-promote.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: euro-resmlp-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact CPU-only release-test runtime
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            'numpy>=1.26,<3' 'pandas>=2.1,<3' 'torch>=2.3,<3' \
            'pytest>=8,<10' 'streamlit==1.66.1'
      - name: Retrieve exact overnight Ray champion (no training)
        uses: actions/download-artifact@v4
        with:
          name: european-deep-neural-overnight-20261110
          run-id: 42679651225
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ray-champion
      - name: Verify provenance and package checksum
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          import torch
          root=Path('models/europe-resmlp')
          root.mkdir(parents=True,exist_ok=True)
          source=Path('${{ runner.temp }}/ray-champion')
          winner=json.loads((source/'comparison.json').read_text())
          old_schema=json.loads(Path('models/europe-ask/schema.json').read_text())
          top=winner['overall_champion']
          assert top['origin']=='eu-neural-wave2-5'
          assert top['architecture']=='resmlp' and top['kind']=='neural'
          assert top['loss']=='tail_mae_eur'
          assert top['sealed_test_sha256']==old_schema['test_split_sha256']
          assert (winner['training_rows'],winner['validation_rows'],winner['test_rows'])==(1602247,200039,201085)
          pack=torch.load(source/'champion.pt',map_location='cpu',weights_only=True)
          assert pack['config']==top['config']
          assert pack['manifest_train_sha']==old_schema['training_split_sha256']
          assert pack['manifest_valid_sha']==old_schema['validation_split_sha256']
          assert pack['test_scored'] is False
          digest=hashlib.sha256((source/'champion.pt').read_bytes()).hexdigest()
          shutil.copy2(source/'champion.pt',root/'champion.pt')
          shutil.copy2(source/'comparison.json',root/'comparison.json')
          manifest={
            'model':'ResMLP Tail-MAE',
            'source_run_id':42679651225,
            'source_artifact_id':13736822556,
            'source_trial':'eu-neural-wave2-5',
            'checkpoint_sha256':digest,
            'schema_training_sha256':old_schema['training_split_sha256'],
            'sealed_test_sha256':old_schema['test_split_sha256'],
            'release_status':'verified for production main',
            'market':'Europe ASK only',
            'production_xgboost_fallback':False,
          }
          (root/'release_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Verified frozen ResMLP checkpoint SHA256:',digest)
          PY
      - name: Validate all new Python source and European tests with real weights
        run: |
          python -m compileall -q pricing/europe_resmlp.py pricing/europe_model.py \
            pricing/europe_market.py tests/test_europe_market.py
          python -m pytest -q tests/test_europe_market.py
      - name: Real ResMLP smoke inference and no US regression
        run: |
          python - <<'PY'
          from pricing.europe_model import load_bundle,estimate,batch_estimate,explain
          model,schema,study=load_bundle()
          v={'seller_country':'de','make':'volkswagen','model':'golf',
             'reg_year':2020,'reg_month':6,'mileage_km':85000,
             'power_hp':110,'fuel':'diesel','transmission':'manual',
             'first_seen_at':schema['snapshot_date']}
          price=estimate(v)
          check=batch_estimate([v,v])
          assert len(check)==2 and abs(check[0]-price)<.01
          assert 100<=price<=1000000 and explain(v)
          print('EU ResMLP live inference smoke passed; asking-price estimate:',round(price,2))
          PY
      - name: Publish one atomic tested release to production main
        run: |
          git config user.name "car-price-studio-release-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/europe-resmlp
          git commit -m "Publish frozen European ResMLP champion and research provenance"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "ResMLP release promoted to main (Streamlit Cloud deployment follows)." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain auditable packaging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: european-resmlp-release-evidence
          path: |
            models/europe-resmlp/release_manifest.json
            models/europe-resmlp/comparison.json
          if-no-files-found: warn
          retention-days: 45
