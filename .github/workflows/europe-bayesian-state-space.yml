name: European Bayesian residual state-space · Eurostat history

on:
  push:
    branches:
      - feature/europe-bayesian-state-space-20261110
    paths:
      - pricing/europe_bayesian_state_space.py
      - pricing/europe_market.py
      - tests/test_europe_bayesian_state_space.py
      - .github/workflows/europe-bayesian-state-space.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install European test stack
        run: python -m pip install "pytest>=8,<10" "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "requests>=2.31,<3" "pyarrow>=17,<24"
      - name: Compile European UI and Bayesian state-space engine
        run: python -m py_compile pricing/europe_market.py pricing/europe_bayesian_state_space.py
      - name: Check observed source, Bayesian AR1 mathematics, uncertainty, non-application and existing flows
        run: python -m pytest -q tests/test_europe_bayesian_state_space.py tests/test_europe_eurostat.py tests/test_europe_price_clock.py tests/test_europe_model_pulse.py
