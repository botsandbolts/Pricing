name: Stop UMAP retraining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/taste-cosine-umap.yml'
permissions:
  contents: read
concurrency:
  group: taste-cosine-umap-release
  cancel-in-progress: true
jobs:
  stopped:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Training stopped at user request. No model deployment.'
