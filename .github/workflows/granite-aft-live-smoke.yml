name: Granite AFT-only production smoke · 36 languages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/granite-aft-live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-and-language-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
      - run: python -m pip install 'numpy>=1.26,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'joblib>=1.4,<2'
      - name: Verify the released checkpoint and render every one of 36 translated banners
        run: |
          python - <<'PY'
          import sys,types
          from pathlib import Path
          import numpy as np
          import torch
          fake=types.ModuleType('streamlit')
          fake.session_state={'cps_locale':'en-GB'}
          sys.modules['streamlit']=fake
          from pricing.granite_aft_ask_live import GraniteAFTAsking,available
          from pricing.granite_aft_i18n import COPY
          from pricing.granite_aft_banner import banner_html
          root=Path.cwd()
          assert available(root)
          assert len(COPY)==36
          model=GraniteAFTAsking(root,_parity_test=True)
          fields={'year':2010,'odometer':95000,'manufacturer':'toyota',
             'model':'corolla','type':'sedan','transmission':'automatic',
             'state':'ca','fuel':'gas','drive':'fwd',
             'title_status':'clean','cylinders':'4 cylinders',
             'paint_color':'blue','condition':'good'}
          prepared={'raw':'Well maintained, clean title, new tires.',
                    'embedding':np.zeros((1,384),dtype=np.float32)}
          result=model.predict_prepared(fields,prepared)
          assert 100<=result['price']<=1e6
          assert result['model']=='Granite R2 97M · INT8 ONNX · DCNv2 AFT'
          for code,translation in COPY.items():
              fake.session_state['cps_locale']=code
              html=banner_html(root)
              assert translation['title'] in html,code
              assert translation['bid_explanation'] in html,code
              assert '18,448 USD' in html,code
              assert '2,805 USD' in html and '5,766 USD' in html
              assert '#studio-calculator' in html
          ui=Path('pricing/neural_experimental_ui.py').read_text()
          assert 'bge' not in ui.lower()
          assert 'lemon' not in ui.lower()
          assert 'model=load_granite_aft(root)' in ui
          assert 'load_granite_aft(root).predict(' in ui
          print('GRANITE_AFT_ONLY_36_LOCALES_RELEASE_SMOKE_PASS',
                round(result['price'],2),flush=True)
          PY
  streamlit-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Wait for published Streamlit process health
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pricing-5a4k2zenhw2nte9xpshxs3.streamlit.app/~/+/_stcore/health'
          for i in $(seq 1 8); do
            output="$(curl -sSL --max-time 22 "$URL" || true)"
            if [[ "$output" == "ok" ]]; then
              echo 'CAR_PRICE_STUDIO_PUBLIC_PROCESS_HEALTH_OK'
              exit 0
            fi
            sleep 7
          done
          echo 'Published Streamlit process did not confirm health'
          exit 1
