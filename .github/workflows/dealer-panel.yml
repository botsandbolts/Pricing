name: Verify Merchant lens panel
on:
  push:
    paths:
      - 'pricing/dealer_positioning_ui.py'
      - 'reports/dealer-positioning/**'
      - '.github/workflows/dealer-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install streamlit pandas requests
      - run: python -m scripts.check_dealer_positioning_ui
