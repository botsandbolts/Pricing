  final_report:
    needs: collect_2
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adaptive-history-2
          path: findings
      - name: Summarize CVaR95-first Ask/Bid results without promoting any model
        run: |
          python - <<'PY'
          import json
          p=json.load(open('findings/history.json'))
          assert len(p['records'])==24
          for market in ('ask','bid'):
              rows=p['leaderboard'][market]
              pruned=p['pruned_counts'][market]
              print(f'{market.upper()}: {len(rows)} completed, {pruned} pruned')
              for row in rows[:5]:
                  print(f"  trial={row['trial']} CVaR95=${row['CVaR95_absolute_USD']:,.0f} RMSE=${row['RMSE_USD']:,.0f} MAE=${row['MAE_USD']:,.0f}")
          assert p['not_for_deployment'] and not p['test_evaluated']
          PY
      - name: No tested candidate is automatically promoted
        run: echo "Original deployed Ask, Bid, frozen BGE, Lemon XGBoost and Captum remain untouched."
