      - name: Install original CPU neural trainers, Optuna, and audit tools
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' 'optuna==4.8.0' joblib
      - uses: actions/download-artifact@v4
        with:
          name: adaptive-plan-1
          path: proposal
      - name: Recover immutable prior study for successive-halving rung comparisons
        uses: actions/download-artifact@v4
        with:
          name: adaptive-history-0
          path: prior
      - name: Reuse original SHA-pinned 2021 Ask training cohort
        if: ${{ matrix.market == 'ask' }}
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
