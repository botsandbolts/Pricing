name: European Eurostat used-car HICP source and valuation tests

on:
  push:
    branches:
      - feature/eurostat-used-car-hicp-clock-20261110
    paths:
      - pricing/europe_eurostat.py
      - pricing/europe_market.py
      - scripts/fetch_europe_eurostat_hicp.py
      - scripts/build_europe_hedonic_fisher.py
      - tests/test_europe_eurostat.py
      - .github/workflows/europe-eurostat-price-clock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "pytest>=8,<10" "requests>=2.31,<3" "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2"
      - name: Compile and test European Eurostat / Fisher clock
        run: |
          python -m py_compile pricing/europe_market.py pricing/europe_eurostat.py pricing/europe_price_clock.py scripts/fetch_europe_eurostat_hicp.py scripts/build_europe_hedonic_fisher.py
          python -m pytest -q tests/test_europe_eurostat.py tests/test_europe_price_clock.py

  fetch-source:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "requests>=2.31,<3"
      - name: Fetch authoritative second-hand-car Eurostat HICP indices
        run: python scripts/fetch_europe_eurostat_hicp.py
      - uses: actions/upload-artifact@v4
        with:
          name: eurostat-used-car-hicp-2025-base-verified
          path: models/europe-ask/eurostat_hicp.json
      - name: Commit validated official monthly index onto feature branch
        if: github.ref == 'refs/heads/feature/eurostat-used-car-hicp-clock-20261110'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/europe-ask/eurostat_hicp.json
          git diff --cached --quiet || git commit -m "Package verified official Eurostat second-hand motor-car index"
          git pull --rebase origin feature/eurostat-used-car-hicp-clock-20261110
          git push origin HEAD:feature/eurostat-used-car-hicp-clock-20261110
