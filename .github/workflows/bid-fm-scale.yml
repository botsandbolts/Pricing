name: Wholesale 26-model FM family scale full vs Lemon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/bid_fm_scale_*.py
      - tests/test_bid_fm_scale.py
      - .github/workflows/bid-fm-scale.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: bid-fm-scale-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      deadline: ${{ steps.deadline.outputs.seconds }}
    steps:
      - name: Start strict four-hour experiment deadline
        id: deadline
        run: echo "seconds=$(($(date +%s)+14400))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only FM unit-test stack
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib pytest
      - name: Validate 26 registered FM structures and no-leakage properties
        run: |
          python -m compileall -q scripts/bid_fm_scale_train.py scripts/bid_fm_scale_report.py
          python -m pytest -q tests/test_bid_fm_scale.py

  train:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 26
      matrix:
        trial: [
          fm16_full, fm16_lemon,
          fm32_full, fm32_lemon,
          fm64_full, fm64_lemon,
          fm128_full, fm128_lemon,
          ffm8_full, ffm8_lemon,
          ffm16_full, ffm16_lemon,
          ffm32_full, ffm32_lemon,
          hofm316_full, hofm316_lemon,
          hofm332_full, hofm332_lemon,
          fieldgate16_full, fieldgate16_lemon,
          fieldgate32_full, fieldgate32_lemon,
          deepfm16_full, deepfm16_lemon,
          deepfm32_full, deepfm32_lemon
        ]
    env:
      DEADLINE: ${{ needs.check.outputs.deadline }}
    steps:
      - name: Reject jobs after 4-hour budget
        run: |
          if [ "$((DEADLINE-$(date +%s)))" -lt 900 ]; then
            echo "::error::Study deadline exceeded, skipping model"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU model stack
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib
      - name: Load exact original full/Lemon VIN-disjoint auction cohort
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Train one full-rank FM-family candidate; original VALIDATION only
        run: |
          remaining=$((DEADLINE-$(date +%s)-200))
          if [ "$remaining" -le 180 ]; then
            echo "::error::Study deadline reached before training"
            exit 1
          fi
          if [ "$remaining" -gt 4500 ]; then remaining=4500; fi
          python -u -m scripts.bid_fm_scale_train \
            --trial '${{ matrix.trial }}' \
            --features training-cache/neural-bid/features.npz \
            --max-seconds "$remaining" \
            --output 'training-cache/bid-fm-scale/${{ matrix.trial }}'
      - uses: actions/upload-artifact@v4
        with:
          name: bid-fm-scale-${{ matrix.trial }}
          path: training-cache/bid-fm-scale/${{ matrix.trial }}/
          retention-days: 90
          if-no-files-found: error

  report:
    needs: [check, train]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEADLINE: ${{ needs.check.outputs.deadline }}
    steps:
      - name: Enforce experiment-wide compute window
        run: |
          if [ "$((DEADLINE-$(date +%s)))" -lt 180 ]; then
            echo "::error::Four-hour budget exhausted; no final test scored"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent comparison stack
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' joblib
      - name: Gather exactly 26 independent original-validation checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: bid-fm-scale-*
          path: training-cache/bid-fm-scale
          merge-multiple: false
      - name: Recover frozen VIN/phase original test identities
        uses: actions/download-artifact@v4
        with:
          name: neural-bid-frozen-features
          run-id: 42249111756
          github-token: ${{ github.token }}
          path: training-cache/neural-bid
      - name: Recover matched original XGBoost Lemon and full-model comparators
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-bid
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Rank full vs Lemon by original validation; score ONE test winner
        run: |
          if [ "$((DEADLINE-$(date +%s)))" -lt 90 ]; then
            echo "::error::Study time budget expired"
            exit 1
          fi
          python -u -m scripts.bid_fm_scale_report
      - uses: actions/upload-artifact@v4
        with:
          name: bid-fm-scale-full-vs-lemon-verified
          path: reports/bid-fm-scale/
          retention-days: 90
          if-no-files-found: error
      - name: Publish benchmark report only, never deploy experimental weights
        run: |
          cp -a reports/bid-fm-scale "$RUNNER_TEMP/bid-fm-scale"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/bid-fm-scale
            cp -a "$RUNNER_TEMP/bid-fm-scale/." reports/bid-fm-scale/
            git add reports/bid-fm-scale/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish 26-model FM rank family full-vs-Lemon bid audit'
            git push origin HEAD:main && exit 0
          done
          exit 1
