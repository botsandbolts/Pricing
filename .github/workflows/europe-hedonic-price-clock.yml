name: European Hedonic Fisher and Holt price clock

on:
  push:
    branches:
      - feature/eu-hedonic-fisher-price-clock-20261110
    paths:
      - pricing/europe_price_clock.py
      - pricing/europe_market.py
      - scripts/build_europe_hedonic_fisher.py
      - tests/test_europe_price_clock.py
      - .github/workflows/europe-hedonic-price-clock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated index dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "pyarrow>=18,<24" "pytest>=8,<10"
      - name: Test European price clock
        run: python -m pytest -q tests/test_europe_price_clock.py
      - name: Syntax-check European app and offline builder
        run: python -m py_compile pricing/europe_market.py pricing/europe_price_clock.py scripts/build_europe_hedonic_fisher.py

  build-index:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline training dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.4,<2" "pyarrow>=18,<24" "requests>=2.31,<3"
      - name: Inspect genuine source-month coverage and train Huber-Fisher links
        run: python scripts/build_europe_hedonic_fisher.py --output models/europe-ask/hedonic_fisher.json
      - name: Inspect release status
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          release=json.load(open("models/europe-ask/hedonic_fisher.json",encoding="utf-8"))
          print("Release status:",release["status"])
          print("Observed months by country:",Counter(row["country"] for row in release.get("coverage",[])))
          print("Validated country indices:",list(release.get("countries",{})))
          if release["status"]!="validated":
              print("No synthetic calendar-time changes will be published.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: european-hedonic-fisher-coverage-and-release
          path: models/europe-ask/hedonic_fisher.json
      - name: Commit generated index or unavailable coverage manifest to research branch
        # Only this branch is changed; deployment stays behind code review.
        if: github.ref == 'refs/heads/feature/eu-hedonic-fisher-price-clock-20261110'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/europe-ask/hedonic_fisher.json
          git diff --cached --quiet || git commit -m "Record European observed-month coverage and validated Fisher release"
          git push origin HEAD:feature/eu-hedonic-fisher-price-clock-20261110
