name: Verify Drive Chemistry branded UI on installed catalogue
on:
  push:
    paths:
      - 'scripts/verify_garage_brand.py'
      - '.github/workflows/taste-brand.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2' scikit-learn==1.8.0 'xgboost>=3.1,<4' hdbscan==0.8.44 faiss-cpu streamlit==1.66.1 requests pytest
      - run: python -m pytest tests/test_taste_garage.py tests/test_taste_release_ui.py -q
      - run: python -m scripts.verify_garage_brand
      - uses: actions/upload-artifact@v4
        with:
          name: drive-chemistry-ui-check
          path: drive-chemistry-ui-check.json
