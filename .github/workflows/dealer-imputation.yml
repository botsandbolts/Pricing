name: XGBoost multiple-imputation overlap sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/dealer_imputation.py'
      - 'pricing/xgb_imputation.py'
      - '.github/workflows/dealer-imputation.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn xgboost pytest
      - run: python -m pytest tests/test_xgb_imputation.py -q
      - run: python -u -m scripts.dealer_imputation
      - uses: actions/upload-artifact@v4
        with:
          name: dealer-imputation-sensitivity
          path: reports/dealer-overlap/imputation.json
      - run: |
          cp reports/dealer-overlap/imputation.json "$RUNNER_TEMP/imputation.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/dealer-overlap
            cp "$RUNNER_TEMP/imputation.json" reports/dealer-overlap/imputation.json
            git add reports/dealer-overlap/imputation.json
            git diff --cached --quiet && exit 0
            git commit -m "Publish XGBoost imputation overlap sensitivity"
            git push origin HEAD:main && exit 0
          done
          exit 1
