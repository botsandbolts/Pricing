name: XGBoost multiple-imputation overlap sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/dealer_imputation.py'
      - 'pricing/xgb_imputation.py'
      - 'scripts/dealer_complete_analysis.py'
      - 'pricing/lemon_oof.py'
      - '.github/workflows/dealer-imputation.yml'
permissions:
  contents: write
  actions: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            pricing
            scripts
            tests
            data/merchant-discovery-minilm
            reports/dealer-positioning
            reports/dealer-overlap
            models/xgboost-hierarchy/ask
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn xgboost pytest streamlit requests
      - uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-ask
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: training-cache/lemon-hierarchy
      - run: python -m pytest tests/test_lemon_oof.py tests/test_xgb_imputation.py tests/test_dealer_complete_analysis.py -q
      - run: python -u -m scripts.dealer_complete_analysis
      - run: python -m scripts.check_completed_merchant_panel
      - uses: actions/upload-artifact@v4
        with:
          name: dealer-completed-analysis
          path: reports/dealer-overlap/completed-analysis.json
      - run: |
          cp reports/dealer-overlap/completed-analysis.json "$RUNNER_TEMP/completed-analysis.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/dealer-overlap
            cp "$RUNNER_TEMP/completed-analysis.json" reports/dealer-overlap/completed-analysis.json
            git add reports/dealer-overlap/completed-analysis.json
            git diff --cached --quiet && exit 0
            git commit -m "Publish XGBoost imputation overlap sensitivity"
            git push origin HEAD:main && exit 0
          done
          exit 1
