name: Parallel CPU MiniLM and transformer merchant NER
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/merchant_transformer_cpu.py'
      - '.github/workflows/merchant-transformer-cpu.yml'
permissions:
  contents: read
concurrency:
  group: merchant-transformer-cpu
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'numpy<3' 'pandas<3' scipy scikit-learn spacy sentence-transformers streamlit pytest faiss-cpu requests
      - run: python -m pytest tests/test_merchant_reco.py -q
      - run: python -m scripts.prepare_lemon_reco --from-catalogue
      - run: python -m scripts.restore_reco_text
      - run: python -u -m scripts.merchant_transformer_cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-minilm-cpu-alternative
          path: |
            data/merchant-discovery-minilm
            merchant-minilm-cpu.zip
            training-cache/merchant-ner-cache.json
          retention-days: 30
