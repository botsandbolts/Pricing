name: Firefox · production pricing journey and full-site UI audit

on:
  push:
    branches: [main]
    paths:
      - app.py
      - pricing/**
      - assets/garage.css
      - scripts/browser_firefox_full_site_audit.py
      - tests/test_real_banner_focus_route.py
      - .github/workflows/real-live-banner-focus-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-live-ui-audit
  cancel-in-progress: true

jobs:
  production_firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test and automation packages
        run: python -m pip install 'pytest>=8,<10' 'playwright>=1.55,<2'
      - name: Install axe-core for WCAG checks
        run: npm install --no-save axe-core
      - name: Syntax-check audit and app entrypoints
        run: python -m compileall -q app.py pricing scripts/browser_firefox_full_site_audit.py
      - name: Assert stable banner, sample and one-form source structure
        run: python -m pytest -q tests/test_real_banner_focus_route.py tests/test_mobile_lemon75_ux.py
      - name: Install Firefox including its Linux dependencies
        run: python -m playwright install --with-deps firefox
      - name: Audit hosted pricing first, then all 11 public panels and responsive layouts
        run: python -m scripts.browser_firefox_full_site_audit
      - name: Save Firefox screenshots, WCAG findings and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-production-full-site-ui-audit
          path: reports/qa/real-live-firefox/
          if-no-files-found: warn
          retention-days: 30
