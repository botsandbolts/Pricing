name: BOHB Ask · 30-minute AFT and robust weighted-loss search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bohb-aft-ask-30m.yml
      - scripts/bohb_aft_ask_30m.py
      - tests/test_bohb_aft_ask_30m.py

permissions:
  contents: read
  actions: read

concurrency:
  group: bohb-ask-aft-30m-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch, genuine HpBandSter BOHB and test tooling
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' pytest
      - name: Compile and test real BOHB KDE, resource promotion and exact AFT mixture
        run: |
          python -m compileall -q scripts/bohb_aft_ask_30m.py tests/test_bohb_aft_ask_30m.py
          python -m pytest -q tests/test_bohb_aft_ask_30m.py

  search:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        architecture: [resmlp, deepcross]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research runtime and genuine HpBandSter
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<2' 'hpbandster==0.7.4' 'ConfigSpace>=0.7,<2' 'pandas>=2.1,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.4,<2' pyarrow
      - name: Recover canonical Ask features from pinned run
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Recover SHA-verified BGE 384D vectors
        uses: actions/download-artifact@v4
        with:
          name: raw-ask-embeddings-bge-256
          run-id: 42270078516
          github-token: ${{ github.token }}
          path: training-cache/bge-256
      - name: Run half-hour exact-AFT + weighted dollar-tail BOHB
        run: |
          python -u -m scripts.bohb_aft_ask_30m \
            --architecture ${{ matrix.architecture }} \
            --features training-cache/neural-ask/features.npz \
            --embeddings training-cache/bge-256 \
            --search-seconds 1620 --reserve-seconds 85 \
            --output reports/bohb-aft-ask/${{ matrix.architecture }}
      - name: Audit internal-only winner and independently verify external original validation
        run: |
          python - <<'PY'
          import json, numpy as np, pandas as pd
          from pathlib import Path
          from scripts.cvar95_historical import risk
          folder=Path('reports/bohb-aft-ask/${{ matrix.architecture }}')
          d=json.loads((folder/'result.json').read_text())
          assert d['status']=='completed' and d['original_test_scored'] is False
          assert d['original_validation_selection'] is False and d['auto_deploy'] is False
          assert d['censored_rows']==0 and d['original_validation_rows']==31668
          assert (folder/'weights.pt').is_file()
          p=pd.read_csv(folder/'validation.csv.gz',dtype={'row_id':str})
          assert len(p)==31668 and p.row_id.is_unique and p.split.eq('validation').all()
          scores=risk(p.observed_price.to_numpy(float),p.predicted_price.to_numpy(float))
          for metric in ('CVaR95_absolute_USD','MAE_USD','RMSE_USD'):
            assert abs(scores[metric]-d['original_validation'][metric])<.1
          print('BOHB_AFT_ASK_VALIDATED',d['architecture'],scores)
          PY
      - name: Publish validated BOHB Ask research reports and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bohb-ask-aft-${{ matrix.architecture }}
          path: |
            reports/bohb-aft-ask/${{ matrix.architecture }}/result.json
            reports/bohb-aft-ask/${{ matrix.architecture }}/history.json
            reports/bohb-aft-ask/${{ matrix.architecture }}/status.json
            reports/bohb-aft-ask/${{ matrix.architecture }}/weights.pt
            reports/bohb-aft-ask/${{ matrix.architecture }}/validation.csv.gz
          retention-days: 90
          if-no-files-found: warn
