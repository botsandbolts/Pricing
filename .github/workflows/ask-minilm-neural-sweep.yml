name: Frozen MiniLM two-OOB neural asking sweep (18 arms)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ask_minilm_*.py
      - tests/test_ask_minilm_oob.py
      - .github/workflows/ask-minilm-neural-sweep.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: ask-minilm-neural-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' pytest
      - name: Check code and two-OOB price leakage guards
        run: |
          python -m compileall -q scripts/ask_minilm_augment.py scripts/ask_minilm_train.py scripts/ask_minilm_report.py
          python -m pytest tests/test_ask_minilm_oob.py -q

  prepare:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' 'pyarrow>=15,<25'
      - name: Recover original successfully audited neural features and Parquet
        uses: actions/download-artifact@v4
        with:
          name: neural-ask-frozen-features
          run-id: 42224932982
          github-token: ${{ github.token }}
          path: training-cache/neural-ask
      - name: Restore pretrained MiniLM embeddings from original cached Kaggle cohort
        uses: actions/cache/restore@v4
        id: minilm-cache
        with:
          path: training-cache/minilm-embeddings
          key: minilm-128-1110a243-746bc9f8-clean-v2
      - name: Re-encode using same pinned ONNX MiniLM only if the cache expired
        if: steps.minilm-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install 'onnxruntime>=1.18,<2' 'tokenizers>=0.20,<1'
          python -u -m scripts.ask_minilm_augment --encode-fallback
      - name: Fit honest two-out-of-bag MiniLM price signal for full and Lemon cohorts
        run: python -u -m scripts.ask_minilm_augment
      - uses: actions/upload-artifact@v4
        with:
          name: ask-minilm-2oob-features
          path: |
            training-cache/ask-minilm/full/
            training-cache/ask-minilm/lemon/
          retention-days: 90
          if-no-files-found: error

  train:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        architecture: [resmlp, deepcross, fttransformer]
        loss: [huber, quantile50, aft]
        cohort: [full, lemon]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same neural CPU training stack as original benchmark
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2'
      - uses: actions/download-artifact@v4
        with:
          name: ask-minilm-2oob-features
          path: training-cache/ask-minilm
      - name: Train original architecture with MiniLM price feature
        run: |
          python -u -m scripts.ask_minilm_train \
            --arch ${{ matrix.architecture }} \
            --loss ${{ matrix.loss }} \
            --cohort ${{ matrix.cohort }} \
            --data 'training-cache/ask-minilm/${{ matrix.cohort }}/features.npz' \
            --output 'training-cache/ask-minilm-results/${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ask-minilm-result-${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}
          path: training-cache/ask-minilm-results/${{ matrix.architecture }}-${{ matrix.loss }}-${{ matrix.cohort }}/
          retention-days: 90
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11,<2'
      - name: Collect all genuine 18 MiniLM neural model outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ask-minilm-result-*
          path: training-cache/ask-minilm-results
          merge-multiple: false
      - name: Recover frozen XGBoost Lemon reference for original per-row audit
        uses: actions/download-artifact@v4
        with:
          name: lemon-hierarchy-ask
          run-id: 41605651393
          github-token: ${{ github.token }}
          path: benchmark-reference
      - name: Compare to original 18 arms and exact XGBoost holdouts
        run: python -u -m scripts.ask_minilm_report
      - uses: actions/upload-artifact@v4
        with:
          name: ask-minilm-2oob-verified-comparison
          path: reports/ask-minilm-neural-benchmark/
          retention-days: 90
          if-no-files-found: error
      - name: Publish verified compact results; leave production unchanged
        run: |
          cp -a reports/ask-minilm-neural-benchmark "$RUNNER_TEMP/ask-minilm-neural-benchmark"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/ask-minilm-neural-benchmark
            cp -a "$RUNNER_TEMP/ask-minilm-neural-benchmark/." reports/ask-minilm-neural-benchmark/
            git add reports/ask-minilm-neural-benchmark/
            git diff --cached --quiet && exit 0
            git commit -m 'Publish matched 18-arm MiniLM two-OOB asking-price benchmark'
            git push origin HEAD:main && exit 0
          done
          exit 1
