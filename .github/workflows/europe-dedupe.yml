name: European linkage synthetic checks

on:
  pull_request:
    paths:
      - 'pricing/europe_dedupe.py'
      - 'pricing/europe_prune.py'
      - 'pricing/europe_make_shards.py'
      - 'tests/test_europe_dedupe.py'
      - 'tests/test_europe_make_shards.py'
      - 'requirements-europe-dedupe.txt'
      - '.github/workflows/europe-dedupe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline requirements
        run: python -m pip install -r requirements-europe-dedupe.txt
      - run: python -m pytest -q tests/test_europe_dedupe.py tests/test_europe_make_shards.py
