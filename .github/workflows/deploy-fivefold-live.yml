name: Deploy XGBoost Bayesian pricing
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/deploy_fivefold_live.py
      - .github/workflows/deploy-fivefold-live.yml
permissions:
  contents: write
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.11,<2' 'xgboost>=3.0,<4' 'lightgbm>=4.5,<5' 'requests>=2.31,<3' 'umap-learn>=0.5.7,<0.6' 'joblib>=1.3,<2' 'streamlit==1.66.1'
      - uses: actions/download-artifact@v4
        with:
          name: xgboost-fivefold-ask
          run-id: 41189327994
          github-token: ${{ github.token }}
          path: training-cache/xgb-source/ask
      - uses: actions/download-artifact@v4
        with:
          name: xgboost-fivefold-bid
          run-id: 41190411926
          github-token: ${{ github.token }}
          path: training-cache/xgb-source/bid
      - name: Restore original cohorts
        run: |
          curl --fail --location --retry 3 --output training-cache/ask.zip 'https://zenodo.org/records/10457828/files/Used%20Cars%20Dataset.zip?download=1'
          echo 'eb2ad6c7dedd3c73ffed4bf47929ab66e55d7da186ed240230caa1fad85d2e8f  training-cache/ask.zip' | sha256sum -c -
          curl --fail --location --retry 3 --output training-cache/bid.zip 'https://www.kaggle.com/api/v1/datasets/download/tunguz/used-car-auction-prices'
          echo 'acfe086790275ce843700303f0701446f5326852be1ee11d9d2e9407d0301e8d  training-cache/bid.zip' | sha256sum -c -
          python -m scripts.prepare_full training-cache/ask.zip --output training-cache/full-cohort.jsonl --workers 4
          python -m carbids.data --input training-cache/bid.zip --output training-cache/bid-cohort.jsonl
      - name: Fit matching Bayesian posteriors
        run: |
          python -m scripts.fit_fivefold_bayes --base-kind xgboost --market ask --cohort training-cache/full-cohort.jsonl --predictions training-cache/xgb-source/ask/predictions.csv.gz --output training-cache/xgb-source/ask/bayesian
          python -m scripts.fit_fivefold_bayes --base-kind xgboost --market bid --cohort training-cache/bid-cohort.jsonl --predictions training-cache/xgb-source/bid/predictions.csv.gz --output training-cache/xgb-source/bid/bayesian
      - name: Package and verify real inference
        run: |
          python -m compileall -q pricing/fivefold_live.py pricing/hierarchical_ui.py pricing/forest_form.py
          python -m scripts.deploy_fivefold_live
      - uses: actions/upload-artifact@v4
        with:
          name: xgboost-bayesian-serving
          path: models/fivefold-live/
          retention-days: 90
      - name: Install verified weights for Streamlit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/fivefold-live/
          git commit -m 'Deploy verified XGBoost refits and matching Bayesian posteriors'
          git pull --rebase origin main
          git push origin HEAD:main
