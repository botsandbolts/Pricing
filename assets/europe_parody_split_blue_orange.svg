<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Wir kaufen dein Auto NICHT — Car Price Studio</title>
<desc id="desc">Satirischer Vergleich von Autokaufwerbung und unabhängiger Preisbewertung, ohne Verbindung zu anderen Marken.</desc>
