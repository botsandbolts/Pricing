 <linearGradient id="left" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#185b83"/><stop offset="1" stop-color="#0a3150"/></linearGradient>
 <linearGradient id="right" x1="0" x2="1"><stop stop-color="#142f38"/><stop offset="1" stop-color="#09191f"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020c14" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="560" fill="url(#left)"/>
